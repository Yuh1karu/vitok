<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">

<title>Виток</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@700;800&display=swap" media="print" onload="this.media='all'">
<script>
window.VTH=(function(){
var ACC=['#bff36a','#4fe3b5','#58b6ff','#a37bff','#ff8fb0','#ffb15c','#2fa866'],BGD=['#0d1412','#0e0f11','#0c1220','#150f1a','#000000'],BGL=['#f3f6f4','#f4f4f5','#f8f4ec','#eef3fb','#ffffff'];
function rgb(h){h=h.replace('#','');return[parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]}
function hex(a){return'#'+a.map(function(x){x=Math.max(0,Math.min(255,Math.round(x)));return(x<16?'0':'')+x.toString(16)}).join('')}
function mix(a,b,k){var A=rgb(a),B=rgb(b);return hex([0,1,2].map(function(i){return A[i]+(B[i]-A[i])*k}))}
function lum(h){var c=rgb(h).map(function(v){v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)});return .2126*c[0]+.7152*c[1]+.0722*c[2]}
function load(){try{return JSON.parse(localStorage.getItem('vitok-theme'))||{}}catch(e){return{}}}
function save(T){try{localStorage.setItem('vitok-theme',JSON.stringify(T))}catch(e){}}
function cur(){var m=load().mode||'dark';if(m==='auto')m=(window.matchMedia&&matchMedia('(prefers-color-scheme: light)').matches)?'light':'dark';return m}
function vals(T,m){var d=m==='light'?(T.lt||{}):(T.dk||{});return{acc:d.acc||(m==='light'?'#2fa866':'#bff36a'),bg:d.bg||(m==='light'?'#f3f6f4':'#0d1412')}}
function apply(){
  var T=load(),m=cur(),v=vals(T,m),s=document.documentElement.style,L=m==='light',bg=v.bg,acc=v.acc;
  document.documentElement.setAttribute('data-theme',m);
  var P={'--bg':bg,'--acc':acc,'--on':lum(acc)>.5?'#0d1412':'#ffffff','--acct':L?mix(acc,'#000000',.38):acc,'--fg':L?'#000000':'#ffffff',
   '--p':L?'#ffffff':mix(bg,'#ffffff',.055),'--card':L?mix(bg,'#000000',.025):mix(bg,'#ffffff',.085),'--card2':L?mix(bg,'#000000',.06):mix(bg,'#ffffff',.12),
   '--line':L?mix(bg,'#000000',.12):mix(bg,'#ffffff',.14),'--tx':L?'#14201b':'#edf3ee','--mu':L?'#5f6f67':mix(bg,'#ffffff',.58),
   '--gl1':L?'rgba(255,255,255,.82)':'rgba(255,255,255,.12)','--gl2':L?'rgba(255,255,255,.5)':'rgba(255,255,255,.035)','--glb':L?'rgba(0,0,0,.09)':'rgba(255,255,255,.14)'};
  for(var k in P)s.setProperty(k,P[k]);
  var mt=document.querySelector('meta[name=theme-color]');if(mt)mt.setAttribute('content',bg);
}
apply();
try{if(window.matchMedia)matchMedia('(prefers-color-scheme: light)').addEventListener('change',function(){if((load().mode||'dark')==='auto')apply()})}catch(e){}
return{ACC:ACC,BGD:BGD,BGL:BGL,load:load,save:save,cur:cur,vals:vals,apply:apply}
})();
</script>
<style>

*,*::before,*::after{box-sizing:inherit}
html{background:var(--bg);scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:500 16px/1.4 Manrope,system-ui,sans-serif}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--lamp);outline-offset:2px}
#app{max-width:520px;margin:0 auto;position:relative}
.panel{position:relative;z-index:1;background:var(--p);border-radius:28px 28px 0 0;padding:22px 18px calc(110px + env(safe-area-inset-bottom,0px));min-height:80vh}
h1{font-size:26px;font-weight:800;margin:0}
h2{font-size:20px;font-weight:800;margin:0 0 8px}
.sub{color:var(--mu);font-size:14px;margin:2px 0 8px}
ul{list-style:none;margin:0;padding:0}
.h{display:grid;grid-template-columns:1fr auto;gap:8px 12px;align-items:center;padding:14px 0;border-top:1px solid var(--line)}
.info{text-align:left}
.info b{display:block;font-size:17px}
.info span{display:block;font-size:13px;color:var(--mu)}
.go{width:48px;height:48px;border-radius:50%;border:2px solid var(--c);color:var(--c);display:grid;place-items:center}
.go.on{background:var(--c);color:var(--bg)}
.bar{grid-column:1/-1;height:4px;border-radius:2px;background:var(--line)}
.bar i{display:block;height:100%;border-radius:2px;background:var(--c);transition:width .4s}
.add{width:100%;margin-top:10px;padding:14px;border:1.5px dashed var(--line);border-radius:16px;color:var(--mu)}
#bk{position:fixed;inset:0;z-index:5;background:rgba(5,5,8,.62);display:flex;align-items:flex-end;justify-content:center}
#bk[hidden]{display:none}
#sh{width:100%;max-width:520px;background:var(--p);border-radius:24px 24px 0 0;padding:22px 18px calc(22px + env(safe-area-inset-bottom,0px));max-height:88vh;overflow:auto}
.m{color:var(--mu);font-size:13px;margin:0 0 10px}
.row{display:grid;grid-template-columns:1fr auto;gap:2px 12px;width:100%;text-align:left;padding:13px;margin-top:8px;border:1px solid var(--line);border-radius:14px}
.row span{grid-column:1;color:var(--mu);font-size:13px}
.row i{grid-row:1/3;grid-column:2;font-style:normal;align-self:center;color:var(--acct);font-weight:700}
.row:disabled{opacity:.4;cursor:default}
.f{display:block;margin:14px 0 0;font-size:13px;color:var(--mu)}
.f input{display:block;width:100%;margin-top:6px;padding:12px;background:var(--bg);border:1px solid var(--line);border-radius:12px;color:var(--tx);font:inherit;font-size:16px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:14px}
.seg button{padding:10px;border:1px solid var(--line);border-radius:12px}
.seg .sel{background:var(--line)}
.pr{width:100%;margin-top:14px;padding:14px;border-radius:14px;background:var(--lamp);color:var(--on);font-weight:800}
.btn{width:100%;margin-top:8px;padding:13px;border:1px solid var(--line);border-radius:14px}
#toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:9;background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:10px 16px;font-size:14px;max-width:90vw;text-align:center}
#toast[hidden]{display:none}
.qbtn{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:transparent;color:inherit;font:inherit}
.qbtn.ok{background:#1f7a55;border-color:#1f7a55;color:#fff}
.qbtn.bad{background:#7a2b2b;border-color:#7a2b2b;color:#fff}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;z-index:3;display:grid;grid-template-columns:repeat(4,1fr);background:var(--p);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
.nav button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0;border-radius:12px;color:var(--mu);font-size:12px}
.nav .sel{color:var(--acct)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.tiles div{background:var(--bg);border-radius:16px;padding:14px}
.tiles b{display:block;font-size:26px;font-weight:800}
.tiles span{font-size:13px;color:var(--mu)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;height:120px;margin-top:6px}
.wc{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--mu)}
.wc.now{color:var(--tx);font-weight:800}
.wb{flex:1;width:100%;max-width:30px;border-radius:8px;background:var(--bg);display:flex;align-items:flex-end;overflow:hidden}
.wb i{display:block;width:100%}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.grid2 .btn{margin-top:0}

button:disabled{opacity:.4;cursor:default}
.top{position:sticky;top:0;z-index:2;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:12px;padding:calc(12px + env(safe-area-inset-top,0px)) 18px 12px}
.brand{font-size:24px;font-weight:800}
.stats{display:flex;gap:8px}
.sp{display:flex;align-items:baseline;gap:5px;padding:7px 12px;border-radius:12px;background:var(--p);border:1px solid var(--line)}
.sp b{font-size:18px;font-weight:800}
.sp span{font-size:12px;color:var(--mu)}
.sp.gold b{color:var(--acct)}
.card{background:var(--bg);border-radius:18px;padding:14px;margin:12px 0}
.hero{display:flex;align-items:center;gap:14px}
.ring{--rp:0;flex:none;width:64px;height:64px;border-radius:50%;background:conic-gradient(var(--lamp) calc(var(--rp)*1%),var(--line) 0);display:grid;place-items:center;position:relative}
.ring::before{content:"";position:absolute;inset:7px;border-radius:50%;background:var(--bg)}
.ring b{position:relative;font-size:15px}
.hero .tx b{display:block;font-size:17px}
.hero .tx span{font-size:13px;color:var(--mu)}
details.how summary{font-weight:800;cursor:pointer}
.how ol{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:10px}
.how li{display:grid;grid-template-columns:24px 1fr;gap:10px;font-size:14px;align-items:start}
.how li i{width:24px;height:24px;border-radius:50%;background:var(--line);display:grid;place-items:center;font-style:normal;font-size:13px;font-weight:800;color:var(--acct)}
.next{border:1px solid var(--lamp)}
.next .pr{margin-top:6px}
.prog{height:6px;border-radius:3px;background:var(--line);margin:12px 0 4px}
.prog i{display:block;height:100%;border-radius:3px;background:var(--lamp)}
.ls{display:grid;grid-template-columns:32px 1fr auto;gap:10px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.ls .nm{width:32px;height:32px;border-radius:10px;background:var(--bg);display:grid;place-items:center;font-size:13px;font-weight:800;color:var(--mu)}
.ls.dn .nm{background:#1f7a55;color:#fff}
.ls .tx{min-width:0}
.ls .tx b{display:block;font-size:15px}
.ls .tx span{font-size:12px;color:var(--mu)}
.mini{padding:9px 12px;border-radius:12px;border:1px solid var(--line);font-size:13px;font-weight:700;white-space:nowrap}
.mini.buy{background:var(--lamp);color:var(--on);border-color:var(--lamp)}
.code{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px;font:13px/1.5 ui-monospace,Menlo,Consolas,monospace;overflow-x:auto;margin:10px 0;white-space:pre}
.warn{border-left:3px solid var(--lamp);border-radius:12px}
.vok{color:#5fd49a;font-weight:700}
.vno{color:#ff8f8f;font-weight:700}
#lv{position:fixed;inset:0;z-index:8;background:var(--bg);overflow:auto;max-width:520px;margin:0 auto}
#lv[hidden]{display:none}
.lvh{position:sticky;top:0;z-index:1;background:var(--bg);padding-top:env(safe-area-inset-top,0px)}
.lvt{display:flex;align-items:center;gap:10px;padding:10px 14px 8px}
.lvt b{display:block;font-size:17px}
.lvt span{font-size:12px;color:var(--mu)}
.back{width:40px;height:40px;flex:none;border-radius:12px;background:var(--p);border:1px solid var(--line);font-size:24px;line-height:1}
.lvtabs{display:flex;gap:8px;overflow-x:auto;padding:4px 14px 12px}
.lvtabs button{flex:none;padding:9px 14px;border-radius:12px;border:1px solid var(--line);font-size:14px;font-weight:700;color:var(--mu)}
.lvtabs .dn{color:#5fd49a}
.lvtabs .sel{background:var(--lamp);color:var(--on);border-color:var(--lamp)}
.lvb{padding:6px 18px calc(40px + env(safe-area-inset-bottom,0px))}
.ed{display:block;width:100%;min-height:180px;margin:10px 0;padding:12px;background:var(--p);color:var(--tx);border:1px solid var(--line);border-radius:12px;font:14px/1.5 ui-monospace,Menlo,Consolas,monospace;resize:vertical;tab-size:4}

/* ---------- красота ---------- */

body{background:radial-gradient(900px 420px at 85% -80px,color-mix(in srgb,var(--acc) 22%,transparent),transparent 60%),radial-gradient(700px 380px at -10% 10%,rgba(88,182,255,.14),transparent 60%),var(--bg);background-attachment:fixed}
.top{background:rgba(13,20,18,.78);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid color-mix(in srgb,var(--fg) 4%,transparent)}
.brand{background:linear-gradient(90deg,var(--g1),var(--g2));-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:.3px}
.sp{background:linear-gradient(160deg,var(--card2),var(--p));box-shadow:0 4px 14px rgba(0,0,0,.28)}
.sp.gold{border-color:color-mix(in srgb,var(--acc) 45%,transparent);box-shadow:0 0 16px color-mix(in srgb,var(--acc) 18%,transparent)}
.panel{background:linear-gradient(180deg,var(--card2),var(--card) 60%);box-shadow:0 -10px 40px rgba(0,0,0,.45);border-top:1px solid color-mix(in srgb,var(--fg) 5%,transparent)}
h1{font-size:30px;letter-spacing:-.4px}
.sub#dt{text-transform:capitalize;margin:0 0 6px}
#app section>div:not([hidden]){animation:fin .35s ease}
@keyframes fin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.card{background:linear-gradient(160deg,var(--card),var(--p));border:1px solid color-mix(in srgb,var(--fg) 5%,transparent);box-shadow:0 8px 22px rgba(0,0,0,.28);border-radius:22px;padding:16px}
.hero{background:linear-gradient(135deg,color-mix(in srgb,var(--acc) 16%,transparent),color-mix(in srgb,var(--acc) 6%,transparent) 55%,var(--p));border-color:color-mix(in srgb,var(--acc) 28%,transparent)}
.ring{width:78px;height:78px;box-shadow:0 0 22px color-mix(in srgb,var(--acc) 28%,transparent)}
.ring::before{inset:8px;background:var(--p)}
.ring b{font-size:17px;font-weight:800}
.hero .tx b{font-size:19px}
.t3{grid-template-columns:repeat(3,1fr);gap:8px}
.t3 div{background:linear-gradient(160deg,var(--card),var(--p));border:1px solid color-mix(in srgb,var(--fg) 5%,transparent);text-align:center;padding:12px 6px}
.t3 b{font-size:22px;background:linear-gradient(90deg,var(--g1),var(--g2));-webkit-background-clip:text;background-clip:text;color:transparent}
.t3 span{font-size:12px}
.h{background:linear-gradient(160deg,var(--card),var(--p));border:1px solid color-mix(in srgb,var(--fg) 5%,transparent);border-left:4px solid var(--c);border-radius:20px;padding:14px 14px 12px;margin-top:10px;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.info b{font-size:18px}
.go{width:54px;height:54px;border-width:2.5px;transition:transform .15s,box-shadow .2s;box-shadow:0 0 0 0 transparent}
.go:active{transform:scale(.92)}
.go.on{box-shadow:0 0 18px color-mix(in srgb,var(--c) 55%,transparent)}
.go.run{animation:pls 1.6s ease-in-out infinite}
@keyframes pls{50%{box-shadow:0 0 0 9px color-mix(in srgb,var(--c) 18%,transparent)}}
.bar{height:6px;border-radius:3px}
.bar i{background:linear-gradient(90deg,var(--c),#fff8);transition:width .8s linear}
.add{border-radius:20px;padding:16px;font-weight:700;color:var(--acct);border-color:color-mix(in srgb,var(--acc) 40%,transparent);background:color-mix(in srgb,var(--acc) 5%,transparent)}
.pr{background:linear-gradient(135deg,var(--g1),var(--g2));box-shadow:0 8px 20px color-mix(in srgb,var(--acc) 30%,transparent);border-radius:16px;padding:15px}
.pr:active{transform:scale(.98)}
.btn{background:color-mix(in srgb,var(--fg) 3%,transparent);border-radius:16px}
#sh{background:linear-gradient(180deg,var(--card2),var(--p));border-top:1px solid color-mix(in srgb,var(--fg) 8%,transparent)}
.nav{background:rgba(21,30,27,.88);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid color-mix(in srgb,var(--fg) 6%,transparent)}
.nav button{transition:color .2s,background .2s}
.nav .sel{background:color-mix(in srgb,var(--acc) 12%,transparent)}
.ls{border-radius:16px;border:1px solid color-mix(in srgb,var(--fg) 4%,transparent);background:var(--card);margin-top:8px;padding:12px}
.ls.dn{border-color:rgba(31,122,85,.5)}
.mini.buy{background:linear-gradient(135deg,var(--g1),var(--g2));border:0}
.next{background:linear-gradient(135deg,color-mix(in srgb,var(--acc) 14%,transparent),var(--p))}
.tiles div{background:linear-gradient(160deg,var(--card),var(--p));border:1px solid color-mix(in srgb,var(--fg) 5%,transparent)}
.wb{background:var(--card)}
.lvh{background:rgba(13,20,18,.9);backdrop-filter:blur(12px)}
.lvtabs .sel{background:linear-gradient(135deg,var(--g1),var(--g2));border:0}
.code{background:var(--bg);border-color:var(--card2)}
#toast{background:linear-gradient(135deg,var(--card2),var(--card2));border-color:color-mix(in srgb,var(--acc) 40%,transparent);box-shadow:0 10px 30px rgba(0,0,0,.45);animation:fin .25s}

/* ---------- плавность ---------- */
body{background:var(--bg)}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(900px 420px at 85% -80px,color-mix(in srgb,var(--acc) 20%,transparent),transparent 60%),radial-gradient(700px 380px at -10% 10%,rgba(88,182,255,.12),transparent 60%)}
.top,.nav,.lvh{backdrop-filter:none;-webkit-backdrop-filter:none}
.top{background:var(--bg)}.nav{background:var(--p)}.lvh{background:var(--bg)}
.top,.nav{transform:translateZ(0)}
.nav{transform:translate3d(-50%,0,0)}
.panel,.card,.h,.ls,.sp,.sp.gold,.hero,.pr,.ring{box-shadow:none}
.h,.ls,.card{contain:layout paint}
#app section>div:not([hidden]){animation:none}
.tab-enter{animation:fo .2s ease}
@keyframes fo{from{opacity:0}to{opacity:1}}
.go.run{animation:pls2 1.8s ease-in-out infinite;will-change:transform}
@keyframes pls2{50%{transform:scale(1.08)}}
.go.on{box-shadow:none}

/* ---------- анимации (только transform и opacity, чтобы не лагало) ---------- */
.h,.ls,.card{contain:none}
.card,.h,.ls{box-shadow:0 6px 16px rgba(0,0,0,.24)}
.hero{box-shadow:0 8px 22px color-mix(in srgb,var(--acc) 12%,transparent)}
.pr{box-shadow:0 8px 18px color-mix(in srgb,var(--acc) 28%,transparent)}
.tab-enter{animation:fin .35s cubic-bezier(.2,.8,.2,1)}
@keyframes fin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.go{position:relative}
.go.on{box-shadow:0 0 16px color-mix(in srgb,var(--c) 50%,transparent)}
.go.run{animation:none}
.go.run::after{content:"";position:absolute;inset:-2px;border-radius:50%;border:2px solid var(--c);animation:rg 1.6s ease-out infinite;pointer-events:none}
@keyframes rg{from{transform:scale(1);opacity:.7}to{transform:scale(1.55);opacity:0}}
.go:active,.nav button:active,.mini:active,.btn:active,.add:active,.row:active{transform:scale(.93);transition:transform .1s}
#bk:not([hidden]){animation:fo .2s ease}
#bk:not([hidden]) #sh{animation:up .32s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
#lv:not([hidden]){animation:up .3s cubic-bezier(.2,.8,.2,1)}
#toast:not([hidden]){animation:up .3s cubic-bezier(.2,.8,.2,1)}
.ring{box-shadow:0 0 22px color-mix(in srgb,var(--acc) 28%,transparent)}
.sp.gold{box-shadow:0 0 14px color-mix(in srgb,var(--acc) 20%,transparent)}
.week .wb i{animation:gr .6s cubic-bezier(.2,.8,.2,1) both;transform-origin:bottom}
@keyframes gr{from{transform:scaleY(0)}to{transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- дневник ---------- */
.nav{grid-template-columns:repeat(5,1fr)}.nav button{font-size:11px}
.mood{display:flex;gap:8px;margin:8px 0 12px}
.mood button{flex:1;font-size:26px;padding:8px 0;border-radius:14px;border:1px solid var(--line);background:var(--p);transition:transform .15s}
.mood .sel{border-color:var(--lamp);background:color-mix(in srgb,var(--acc) 16%,transparent);transform:scale(1.07)}
.dg,.dsq{display:block;width:100%;margin-top:8px;padding:12px;background:var(--p);border:1px solid var(--line);border-radius:12px;color:var(--tx);font:inherit;font-size:16px}
.ent .top2{display:flex;justify-content:space-between;align-items:center}
.ent .top2 b{text-transform:capitalize}.ent .top2 span{font-size:24px}
.ent p{margin:6px 0;white-space:pre-wrap}.ent ul li{font-size:14px;color:var(--mu);padding:2px 0}
#lock{position:fixed;inset:0;z-index:30;background:var(--bg);display:grid;place-items:center;padding:20px}
#lock[hidden]{display:none}.lk{width:100%;max-width:320px;text-align:center}
.lk input{width:100%;margin:14px 0 4px;padding:14px;text-align:center;font-size:22px;letter-spacing:6px;background:var(--p);border:1px solid var(--line);border-radius:14px;color:var(--tx)}
.mood button{display:grid;place-items:center;padding:10px 0}.mood .sel{box-shadow:0 0 16px color-mix(in srgb,var(--acc) 35%,transparent)}
.ent .top2 svg{width:30px;height:30px}.st{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--lamp);margin-right:9px;vertical-align:middle}
