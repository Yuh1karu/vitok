<style>
:root{--bg:#0d1412;--p:#151e1b;--card:#111915;--card2:#18221e;--line:#25312c;--tx:#edf3ee;--mu:#8a9b92;--acc:#bff36a;--on:#0d1412;--acct:#bff36a;--fg:#fff;--gl1:rgba(255,255,255,.12);--gl2:rgba(255,255,255,.035);--glb:rgba(255,255,255,.14);--lamp:#bff36a;--g1:#bff36a;--g2:#4fe3b5;--blue:#58b6ff;box-sizing:border-box;color-scheme:dark}

*,*::before,*::after{box-sizing:inherit}
html{background:var(--bg);scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:500 16px/1.4 Manrope,system-ui,sans-serif}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--lamp);outline-offset:2px}
#app{max-width:520px;margin:0 auto;position:relative}
.panel{position:relative;z-index:1;background:var(--p);border-radius:28px 28px 0 0;padding:22px 18px calc(110px + env(safe-area-inset-bottom,0px));min-height:80vh}
h1{font-size:26px;font-weight:800;margin:0}
h2{font-size:20px;font-weight:800;margin:0 0 8px}
.sub{color:var(--mu);font-size:14px;margin:2px 0 8px}
ul{list-style:none;margin:0;padding:0}
.h{display:grid;grid-template-columns:1fr auto;gap:8px 12px;align-items:center;padding:14px 0;border-top:1px solid var(--line)}
.info{text-align:left}
.info b{display:block;font-size:17px}
.info span{display:block;font-size:13px;color:var(--mu)}
.go{width:48px;height:48px;border-radius:50%;border:2px solid var(--c);color:var(--c);display:grid;place-items:center}
.go.on{background:var(--c);color:var(--bg)}
.bar{grid-column:1/-1;height:4px;border-radius:2px;background:var(--line)}
.bar i{display:block;height:100%;border-radius:2px;background:var(--c);transition:width .4s}
.add{width:100%;margin-top:10px;padding:14px;border:1.5px dashed var(--line);border-radius:16px;color:var(--mu)}
#bk{position:fixed;inset:0;z-index:5;background:rgba(5,5,8,.62);display:flex;align-items:flex-end;justify-content:center}
#bk[hidden]{display:none}
#sh{width:100%;max-width:520px;background:var(--p);border-radius:24px 24px 0 0;padding:22px 18px calc(22px + env(safe-area-inset-bottom,0px));max-height:88vh;overflow:auto}
.m{color:var(--mu);font-size:13px;margin:0 0 10px}
.row{display:grid;grid-template-columns:1fr auto;gap:2px 12px;width:100%;text-align:left;padding:13px;margin-top:8px;border:1px solid var(--line);border-radius:14px}
.row span{grid-column:1;color:var(--mu);font-size:13px}
.row i{grid-row:1/3;grid-column:2;font-style:normal;align-self:center;color:var(--acct);font-weight:700}
.row:disabled{opacity:.4;cursor:default}
.f{display:block;margin:14px 0 0;font-size:13px;color:var(--mu)}
.f input{display:block;width:100%;margin-top:6px;padding:12px;background:var(--bg);border:1px solid var(--line);border-radius:12px;color:var(--tx);font:inherit;font-size:16px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:14px}
.seg button{padding:10px;border:1px solid var(--line);border-radius:12px}
.seg .sel{background:var(--line)}
.pr{width:100%;margin-top:14px;padding:14px;border-radius:14px;background:var(--lamp);color:var(--on);font-weight:800}
.btn{width:100%;margin-top:8px;padding:13px;border:1px solid var(--line);border-radius:14px}
#toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:9;background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:10px 16px;font-size:14px;max-width:90vw;text-align:center}
#toast[hidden]{display:none}
.qbtn{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:transparent;color:inherit;font:inherit}
.qbtn.ok{background:#1f7a55;border-color:#1f7a55;color:#fff}
.qbtn.bad{background:#7a2b2b;border-color:#7a2b2b;color:#fff}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;z-index:3;display:grid;grid-template-columns:repeat(4,1fr);background:var(--p);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
.nav button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0;border-radius:12px;color:var(--mu);font-size:12px}
.nav .sel{color:var(--acct)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.tiles div{background:var(--bg);border-radius:16px;padding:14px}
.tiles b{display:block;font-size:26px;font-weight:800}
.tiles span{font-size:13px;color:var(--mu)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;height:120px;margin-top:6px}
.wc{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--mu)}
.wc.now{color:var(--tx);font-weight:800}
.wb{flex:1;width:100%;max-width:30px;border-radius:8px;background:var(--bg);display:flex;align-items:flex-end;overflow:hidden}
.wb i{display:block;width:100%}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.grid2 .btn{margin-top:0}

button:disabled{opacity:.4;cursor:default}
/* ===== 2.4: премиум-эффекты, меню акцента ===== */
.nfx{display:inline-block}
.n-rainbow,.n-gold,.n-fire,.n-ice,.n-grad,.n-sunset,.n-toxic,.n-chrome,.n-aurora{background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent!important;-webkit-text-fill-color:transparent;animation:nshift 4s linear infinite}
.n-rainbow{background-image:linear-gradient(90deg,#ff5f6d,#ffc371,#f9f871,#4fe3b5,#58b6ff,#a37bff,#ff8fb0,#ff5f6d)}
.n-gold{background-image:linear-gradient(90deg,#b8860b,#ffe27a,#fff6c9,#ffd24a,#b8860b);animation-duration:3s}
.n-fire{background-image:linear-gradient(90deg,#ff3d00,#ff9100,#ffe066,#ff6d00,#ff3d00);animation-duration:2.4s}
.n-ice{background-image:linear-gradient(90deg,#58b6ff,#d9f6ff,#8fe9ff,#a37bff,#58b6ff);animation-duration:5s}
.n-neon{color:var(--nc,#4fe3b5);text-shadow:0 0 5px var(--nc,#4fe3b5),0 0 14px var(--nc,#4fe3b5);animation:nglow 2.4s ease-in-out infinite}
.n-color{color:var(--nc,#4fe3b5)}
.n-grad{background-image:linear-gradient(90deg,var(--nc,#ff5f6d),var(--nc2,#58b6ff),var(--nc,#ff5f6d));animation-duration:5s}
.n-shimmer{background:linear-gradient(110deg,var(--nc,#ffd24a) 40%,#fff 50%,var(--nc,#ffd24a) 60%) 0 0/250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;animation:shm 2.6s linear infinite}
@keyframes shm{to{background-position:-150% 0}}
.n-glitch{color:var(--nc,#fff);text-shadow:2px 0 #ff2e63,-2px 0 #08d9d6;animation:gl 2.4s steps(1) infinite}
@keyframes gl{0%,88%,100%{text-shadow:2px 0 #ff2e63,-2px 0 #08d9d6;transform:none}90%{text-shadow:-3px 0 #ff2e63,3px 0 #08d9d6;transform:translateX(1px)}94%{text-shadow:3px 0 #08d9d6,-3px 0 #ff2e63;transform:translateX(-1px)}}
@keyframes nshift{to{background-position:300% 0}}
.n-sunset{background-image:linear-gradient(90deg,#ff5e62,#ff9966,#ffd86f,#f857a6,#a855f7,#ff5e62);animation-duration:4s}
.n-toxic{background-image:linear-gradient(90deg,#39ff14,#b6ff00,#00ffa3,#7dff3a,#39ff14);animation-duration:2.8s}
.n-chrome{background-image:linear-gradient(90deg,#8a939b,#f2f5f7,#aeb6bd,#ffffff,#7d868d,#8a939b);animation-duration:3.4s}
.n-aurora{background-image:linear-gradient(90deg,#00f5a0,#00d9f5,#7b61ff,#ff61d8,#00f5a0);animation-duration:6s}
.n-outline{color:transparent;-webkit-text-fill-color:transparent;-webkit-text-stroke:1.5px var(--nc,#4fe3b5)}
.n-shadow3d{color:var(--nc,#ffd24a);text-shadow:1px 1px 0 rgba(0,0,0,.4),2px 2px 0 rgba(0,0,0,.33),3px 3px 0 rgba(0,0,0,.26),4px 4px 0 rgba(0,0,0,.2),5px 5px 8px rgba(0,0,0,.35)}
.n-pulse{color:var(--nc,#ff5f6d);animation:pls 1.4s ease-in-out infinite}
@keyframes pls{50%{transform:scale(1.07);opacity:.85}}
.n-flicker{color:var(--nc,#ff4fd8);text-shadow:0 0 4px var(--nc,#ff4fd8),0 0 12px var(--nc,#ff4fd8);animation:flk 3s steps(1) infinite}
@keyframes flk{0%,19%,21%,60%,62%,100%{opacity:1}20%,61%{opacity:.35}63%{opacity:.7}}
.n-wave{color:var(--nc,inherit)}
.wv{display:inline-block;font-style:normal;animation:wvk 1.6s ease-in-out infinite;animation-delay:calc(var(--i) * .09s)}
@keyframes wvk{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes nglow{50%{text-shadow:0 0 3px var(--nc,#4fe3b5),0 0 8px var(--nc,#4fe3b5)}}
@keyframes sheen{from{background-position:150% 0}to{background-position:-100% 0}}
.accrow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px;border:1px solid var(--line);border-radius:14px;background:var(--card2)}
.accrow .dot{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--g1),var(--g2));flex:none}
.accrow b{display:block}.accrow span{font-size:12px;color:var(--mu)}.accrow i{margin-left:auto;font-style:normal;color:var(--acct);font-weight:800}
.fxc{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 8px}
.fxc button{padding:8px 13px;border-radius:999px;border:1.5px solid var(--line);background:var(--card2);font-size:14px}
.fxc button.sel{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 20%,transparent)}
.fxc button.lock{opacity:.55}
.stk{object-fit:contain}
/* разбор ответов, как в Duolingo */
#lout:empty,.fbx:empty{display:none}
.fb{margin-top:12px;padding:12px;border-radius:14px;border:1.5px solid}
.fb.bad{border-color:#ff5f6d;background:color-mix(in srgb,#ff5f6d 10%,transparent)}
.fb.good{border-color:#4fe3b5;background:color-mix(in srgb,#4fe3b5 12%,transparent)}
.fb .m{margin:8px 0 2px}.fb>b:first-child{font-size:16px}
.fbu,.fbc{font-size:16px;line-height:1.8}
.er{text-decoration:underline wavy #ff4d5e;text-decoration-thickness:2px;text-underline-offset:5px;color:#ff7a86;font-weight:700}
.er.gap{display:inline-block;min-width:34px;text-decoration:none;border-bottom:2px solid #ff4d5e;height:1em;vertical-align:text-bottom}
.fbc b,.okw{color:#4fe3b5}
.why{margin:10px 0 0;padding:0;list-style:none}.why li{margin:9px 0;font-size:14px;line-height:1.45;padding-left:10px;border-left:3px solid #ff5f6d}
.fbx .pr{margin-top:10px}

/* рамки аватарки: разные формы и цвета */
@property --r{syntax:'<angle>';inherits:false;initial-value:0deg}
.fw{--rw:3px;--gap:3px;position:relative;display:inline-grid;place-items:center;flex:none;padding:calc(var(--rw) + var(--gap));border-radius:50%;background:#000}
.fw::before{content:"";position:absolute;inset:0;border-radius:50%;padding:var(--rw);pointer-events:none;background:linear-gradient(135deg,var(--f1,#bff36a),var(--f2,#4fe3b5));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);mask-composite:exclude}
.fw .ava{margin:0;border-radius:50%}
.fa-spin::before{background:conic-gradient(from var(--r),var(--f1),var(--f2),var(--f1));animation:frs 4s linear infinite}
@keyframes frs{to{--r:360deg}}
.tg-av:has(.fw){border:0;background:none;border-radius:0}
.fw.nr{padding:0}.fw.nr::before{display:none}
.fs-thick{--rw:4px}.fs-double{--rw:2px}
.fs-double::after{content:"";position:absolute;inset:calc(var(--p,6px) - 2px);border-radius:50%;border:1.5px solid var(--f2);pointer-events:none}
.fs-dashed::before{background:repeating-conic-gradient(from var(--r,0deg),var(--f1) 0 12deg,transparent 12deg 24deg)}
.fs-tri::before{background:conic-gradient(from var(--r,0deg),var(--f1) 0 100deg,transparent 100deg 120deg,var(--f2) 120deg 220deg,transparent 220deg 240deg,var(--f1) 240deg 340deg,transparent 340deg 360deg)}
.fs-glow{--rw:2px}
.fs-glow{box-shadow:0 0 12px color-mix(in srgb,var(--f1) 75%,transparent),inset 0 0 10px color-mix(in srgb,var(--f2) 50%,transparent)}
.fs-royal{--rw:4px}
.fs-royal::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 2px,#fff 0 2.4px,transparent 3px),radial-gradient(circle at 50% calc(100% - 2px),#fff 0 2.4px,transparent 3px),radial-gradient(circle at 2px 50%,#fff 0 2.4px,transparent 3px),radial-gradient(circle at calc(100% - 2px) 50%,#fff 0 2.4px,transparent 3px)}
.fs-rainbow::before{background:conic-gradient(from var(--r,0deg),#ff5e62,#ffd86f,#4fe3b5,#58b6ff,#a855f7,#ff5e62)}
.lbr .fs-thick,.lbr .fs-royal{--rw:3px}
.fa-pulse::before{animation:frp 1.8s ease-in-out infinite}.fa-hue::before{animation:frh 5s linear infinite}
@keyframes frp{50%{opacity:.3}}@keyframes frh{to{filter:hue-rotate(360deg)}}
.fa-pulse.fs-glow{animation:frg 1.8s ease-in-out infinite}
@keyframes frg{50%{box-shadow:0 0 4px color-mix(in srgb,var(--f1) 40%,transparent),inset 0 0 3px color-mix(in srgb,var(--f2) 30%,transparent)}}
.dcr{position:absolute;inset:-25%;z-index:3;pointer-events:none}
.dcr svg{display:block;width:100%;height:100%;overflow:visible;--d1:var(--f1);--d2:var(--f2)}
.dcr .tw{transform-box:fill-box;transform-origin:center;animation:dctw 1.8s ease-in-out infinite alternate}
.dcr .fl{animation:dcfl 2.4s ease-in-out infinite}
@keyframes dctw{from{opacity:.25;transform:scale(.6)}to{opacity:1;transform:scale(1)}}
@keyframes dcfl{50%{transform:translateY(-3px)}}
/* эффекты баннера */
.pf-banner{position:relative}
.bfxl{position:absolute;inset:0;border-radius:inherit;overflow:hidden;pointer-events:none}
.bfxl::before,.bfxl::after{content:"";position:absolute}

/* ---------- красота ---------- */

body{background:radial-gradient(900px 420px at 85% -80px,color-mix(in srgb,var(--acc) 22%,transparent),transparent 60%),radial-gradient(700px 380px at -10% 10%,rgba(88,182,255,.14),transparent 60%),var(--bg);background-attachment:fixed}

/* ---------- плавность ---------- */
body{background:var(--bg)}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(900px 420px at 85% -80px,color-mix(in srgb,var(--acc) 20%,transparent),transparent 60%),radial-gradient(700px 380px at -10% 10%,rgba(88,182,255,.12),transparent 60%)}

.nav{transform:translate3d(-50%,0,0)}
.panel,.card,.h,.ls,.sp,.sp.gold,.hero,.pr,.ring{box-shadow:none}

.go.on{box-shadow:none}

/* ---------- анимации (только transform и opacity, чтобы не лагало) ---------- */
.h,.ls,.card{contain:none}
.card,.h,.ls{box-shadow:0 6px 16px rgba(0,0,0,.24)}
.hero{box-shadow:0 8px 22px color-mix(in srgb,var(--acc) 12%,transparent)}
.pr{box-shadow:0 8px 18px color-mix(in srgb,var(--acc) 28%,transparent)}
.tab-enter{animation:fin .35s cubic-bezier(.2,.8,.2,1)}
@keyframes fin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.go{position:relative}
.go.on{box-shadow:0 0 16px color-mix(in srgb,var(--c) 50%,transparent)}
.go.run{animation:none}
.go.run::after{content:"";position:absolute;inset:-2px;border-radius:50%;border:2px solid var(--c);animation:rg 1.6s ease-out infinite;pointer-events:none}

.go:active,.nav button:active,.mini:active,.btn:active,.add:active,.row:active{transform:scale(.93);transition:transform .1s}
#bk:not([hidden]){animation:fo .15s ease}

@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}

.ring{box-shadow:0 0 22px color-mix(in srgb,var(--acc) 28%,transparent)}

@keyframes pop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.12)}100%{transform:none;opacity:1}}
@keyframes shk{20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
@keyframes bmp{40%{transform:scale(1.22)}}
@keyframes drop{from{opacity:0;transform:translateY(-14px)}to{opacity:1;transform:none}}
@keyframes flt{50%{transform:translateY(-3px)}}

.top .brand{animation:drop .5s cubic-bezier(.2,.8,.2,1) both}

  return{v:1,streak:streak(),spark:bl(),wk,cats:catMin(),learn,cur:S.lsel||null,nx,habits:S.habits.length,ach:(typeof ACH!='undefined'?Object.keys(S.ach||{}).filter(k=>ACH.some(a=>a[0]==k)):Object.keys(S.ach||{})),ts:NOW()}}

function cropOpen(im,W,H,cb,done,alpha){const fw=Math.min(innerWidth*.9,420),fh=fw*H/W,k0=Math.max(fw/im.width,fh/im.height);let z=1,sx=1,sy=1,ox=0,oy=0;
  const o=document.createElement('div');o.id='crop';
  o.innerHTML='<div class="cr-box"><p class="m" style="margin:0 0 8px">Двигай пальцем, ниже меняй масштаб и растяжение</p><div class="cr-f" style="width:'+fw+'px;height:'+fh+'px"><img src="'+im.src+'" draggable="false"></div><label>Масштаб<input type="range" id="cz" min="0.3" max="4" step="0.01" value="1"></label><label>Ширина<input type="range" id="cx" min="0.4" max="2.5" step="0.01" value="1"></label><label>Высота<input type="range" id="cy" min="0.4" max="2.5" step="0.01" value="1"></label><div class="cr-b"><button class="btn" id="cn">Отмена</button><button class="pr" id="cd">Готово</button></div></div>';
  document.body.appendChild(o);const img=o.querySelector('img'),fr=o.querySelector('.cr-f');
  const dw=()=>im.width*k0*z*sx,dh=()=>im.height*k0*z*sy;
  const upd=()=>{img.style.cssText='position:absolute;left:50%;top:50%;max-width:none;width:'+dw()+'px;height:'+dh()+'px;transform:translate(-50%,-50%) translate('+ox+'px,'+oy+'px)'};upd();
  let dr=null;fr.addEventListener('pointerdown',e=>{dr=[e.clientX,e.clientY];fr.setPointerCapture(e.pointerId)});
  fr.addEventListener('pointermove',e=>{if(!dr)return;ox+=e.clientX-dr[0];oy+=e.clientY-dr[1];dr=[e.clientX,e.clientY];upd()});
  fr.addEventListener('pointerup',()=>dr=null);fr.addEventListener('pointercancel',()=>dr=null);
  o.querySelector('#cz').oninput=e=>{z=+e.target.value;upd()};o.querySelector('#cx').oninput=e=>{sx=+e.target.value;upd()};o.querySelector('#cy').oninput=e=>{sy=+e.target.value;upd()};
  const end=()=>{o.remove();done&&done()};o.querySelector('#cn').onclick=end;
  o.querySelector('#cd').onclick=()=>{const c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d'),r=W/fw;if(!alpha){x.fillStyle='#111';x.fillRect(0,0,W,H)}x.drawImage(im,(fw/2+ox-dw()/2)*r,(fh/2+oy-dh()/2)*r,dw()*r,dh()*r);cb(alpha?encAlpha(c):c.toDataURL('image/jpeg',.85));end()}}
function encAlpha(c){let d=c.toDataURL('image/webp',.9);if(d.length>70000)d=c.toDataURL('image/webp',.7);if(d.length>70000){const t=document.createElement('canvas');t.width=t.height=96;t.getContext('2d').drawImage(c,0,0,96,96);d=t.toDataURL('image/webp',.7)}return d}

(function(){const A=[["lu1","Lua 1. print() — вывод",5,"print() пишет текст в окно Output в Roblox Studio.","print(\"Привет, Roblox!\")","Куда print() выводит текст в Roblox Studio?",["В чат игры","В окно Output","На экран игрока"],1,["Lua — язык, на котором пишут скрипты в Roblox. Команда print() выводит значение в окно Output в Roblox Studio: так проверяют, что код работает.","Текст берут в кавычки, числа пишут без них. Для предупреждений есть warn(): он выводит жёлтую строку."],"Привет, Roblox!","Написать Print вместо print. В Lua важен регистр букв: Print и print — разные имена.",[["Лёгкая","Выведи слово Hi командой print","print(\"Hi\")"],["Средняя","Выведи число 100","print(100)"],["Сложная","Выведи предупреждение Осторожно командой warn","warn(\"Осторожно\")"]]],["lu2","Lua 2. Переменные local",5,"local создаёт переменную.","local speed = 16\nspeed = speed + 4\nprint(speed)","Что выведет код: local x = 2; x = x + 3; print(x)?",["23","2","5"],2,["Переменная хранит значение. В Lua её создают словом local: local имя = значение. Всегда пиши local, иначе переменная станет глобальной.","Имя пишут без пробелов и не начинают с цифры. Принято писать так: playerSpeed. Знак = значит «положи», а не «равно»."],"20","Забыть local. Без него переменная глобальная, и другой скрипт может случайно её изменить.",[["Лёгкая","Создай переменную coins со значением 10","local coins = 10"],["Средняя","Прибавь к coins число 5 и запиши обратно в coins","coins = coins + 5|coins += 5"],["Сложная","Создай переменную playerName со значением Alex (текст)","local playerName = \"Alex\""]]],["lu3","Lua 3. Строки и ..",5,"Строки склеивают двумя точками.","local name = \"Alex\"\nprint(\"Привет, \" .. name)","Каким знаком склеивают строки в Lua?",["+","..","&"],1,["Текст в Lua называется строкой. Две строки склеивают двумя точками: .. (не плюсом, как в других языках).","Число тоже можно склеить со строкой: \"Монет: \" .. 5. Длину строки даёт знак #: #\"abc\" равно 3."],"Привет, Alex","Использовать + для строк. \"a\" + \"b\" вызовет ошибку, нужно \"a\" .. \"b\".",[["Лёгкая","Выведи Hello World: склей \"Hello\", пробел и \"World\" через .. внутри print","print(\"Hello\" .. \" \" .. \"World\")|print(\"Hello \" .. \"World\")"],["Средняя","Выведи длину строки \"Roblox\" через print и #","print(#\"Roblox\")"],["Сложная","Выведи строку \"Монет: \" и переменную coins, склеив через ..","print(\"Монет: \" .. coins)"]]],["lu4","Lua 4. if и условия",10,"if проверяет условие и выбирает, что выполнять.","local hp = 20\nif hp <= 0 then\n    print(\"Игрок погиб\")\nelse\n    print(\"Жив\")\nend","Как в Lua записывается «не равно»?",["~=","!=","<>"],0,["if условие then ... end: выполнить код, только если условие истинно. else значит «иначе», elseif — ещё одно условие. Каждый блок заканчивается словом end.","Сравнения: == равно, ~= не равно, <, >, <=, >=. Условия объединяют словами and, or, not."],"Жив","Писать != как в других языках. В Lua «не равно» это ~=. И не забывай then и end.",[["Лёгкая","Запиши строку: если hp равно 0 (if ... then)","if hp == 0 then"],["Средняя","Запиши строку: если hp не равно 100","if hp ~= 100 then"],["Сложная","Запиши строку: если hp больше 0 и меньше 100","if hp > 0 and hp < 100 then"]]],["lu5","Lua 5. Циклы for и while",10,"Циклы повторяют код.","for i = 1, 3 do\n    print(i)\nend","Сколько раз выполнится for i = 1, 5 do ... end?",["4","6","5"],2,["for i = 1, 5 do ... end повторяет код 5 раз: i принимает значения 1, 2, 3, 4, 5. Третье число задаёт шаг: for i = 10, 1, -1 считает вниз.","while условие do ... end повторяет, пока условие истинно. В Roblox внутри такого цикла обязательно ставят task.wait(), иначе игра зависнет."],"1\n2\n3","Цикл while true do без task.wait() внутри. Он не отдаёт управление, и Studio зависает.",[["Лёгкая","Запиши заголовок цикла: i от 1 до 10","for i = 1, 10 do"],["Средняя","Запиши заголовок цикла: i от 10 до 1 с шагом -1","for i = 10, 1, -1 do"],["Сложная","Запиши заголовок бесконечного цикла while","while true do"]]],["lu6","Lua 6. Функции",10,"Функция — именованный кусок кода.","local function add(a, b)\n    return a + b\nend\nprint(add(2, 3))","Что делает return?",["Печатает значение","Останавливает игру","Отдаёт результат из функции"],2,["Функция — кусок кода с именем, который можно вызывать много раз. Запись: local function имя(параметры) ... end. Вызов: имя(значения).","return отдаёт результат наружу и завершает функцию. Если return нет, функция вернёт nil, то есть «ничего»."],"5","Забыть return. Функция посчитает, но результат потеряется, а print покажет nil.",[["Лёгкая","Запиши заголовок функции greet без параметров","local function greet()"],["Средняя","Запиши заголовок функции double с параметром x","local function double(x)"],["Сложная","Запиши строку, которая возвращает x умножить на 2","return x * 2"]]],["lu7","Lua 7. Таблицы",10,"Таблица хранит список значений.","local items = {\"меч\", \"щит\"}\nprint(items[1])\nprint(#items)","С какого номера начинаются индексы в Lua?",["С 1","С 0","С -1"],0,["Таблица — список значений в фигурных скобках. Элемент берут по номеру: items[1]. Нумерация в Lua начинается с 1, а не с 0.","#items даёт количество элементов. Добавить элемент: table.insert(items, \"лук\"). Перебрать все: for i, v in ipairs(items) do ... end."],"меч\n2","Брать items[0]. Такого элемента нет, получишь nil: нумерация с 1.",[["Лёгкая","Создай таблицу fruits из трёх текстов: apple, pear, plum","local fruits = {\"apple\", \"pear\", \"plum\"}"],["Средняя","Выведи первый элемент таблицы fruits","print(fruits[1])"],["Сложная","Добавь в таблицу fruits текст kiwi командой table.insert","table.insert(fruits, \"kiwi\")"]]],["lu8","Lua 8. Roblox: объекты и Part",15,"В Roblox всё в мире — объекты со свойствами.","local part = workspace.Part\npart.Anchored = true\npart.BrickColor = BrickColor.new(\"Bright red\")","Где лежат все объекты игрового мира?",["В workspace","В Output","В print"],0,["В Roblox всё в мире — объекты (Instance): детали Part, модели, игроки. Папка с миром называется workspace. workspace.Part — деталь с именем Part.","У объекта есть свойства: Anchored (не падает), Transparency (прозрачность от 0 до 1), Color. Меняют так: part.Transparency = 0.5. Новый объект создаёт Instance.new(\"Part\")."],"Деталь станет красной и неподвижной","Забыть Anchored = true. Деталь упадёт под действием гравитации.",[["Лёгкая","Сделай деталь part неподвижной","part.Anchored = true"],["Средняя","Сделай деталь part наполовину прозрачной","part.Transparency = 0.5"],["Сложная","Создай новую деталь в переменной p командой Instance.new","local p = Instance.new(\"Part\")"]]],["lu9","Lua 9. События: Touched",15,"Событие запускает код, когда что-то произошло.","local part = workspace.Part\npart.Touched:Connect(function(hit)\n    print(hit.Name .. \" коснулся\")\nend)","Когда сработает событие Touched?",["Когда игра запустится","Когда игрок выйдет","Когда что-то коснётся детали"],2,["Событие — сигнал, на который можно подписаться. Подписка: событие:Connect(функция). Когда сигнал приходит, функция выполняется сама.","Touched срабатывает при касании детали, а в hit лежит то, что коснулось. Так делают лаву, ловушки и сбор монет. Найти игрока можно через hit.Parent:FindFirstChild(\"Humanoid\")."],"Имя детали и слово «коснулся» при каждом касании","Писать part.Touched(function...) без :Connect. У событий нужно вызывать :Connect, с двоеточием.",[["Лёгкая","Запиши начало подписки на Touched детали part","part.Touched:Connect(function(hit)"],["Средняя","Запиши строку, которая закрывает подписку","end)"],["Сложная","Запиши подписку на Touched для детали lava (одна строка)","lava.Touched:Connect(function(hit)"]]],["lu10","Lua 10. Игроки и leaderstats",15,"Таблица очков игроков.","game.Players.PlayerAdded:Connect(function(player)\n    local stats = Instance.new(\"Folder\")\n    stats.Name = \"leaderstats\"\n    stats.Parent = player\nend)","Как называется папка, которую Roblox показывает в таблице игроков?",["leaderstats","scoreboard","stats"],0,["Событие game.Players.PlayerAdded срабатывает, когда игрок зашёл в игру. Функция получает объект player.","Чтобы в таблице появились очки, создай в игроке папку с именем leaderstats, а в ней IntValue, например Coins. Такой скрипт кладут в ServerScriptService."],"У игрока появится папка leaderstats","Назвать папку Leaderstats или leaderStats. Имя должно быть ровно leaderstats, маленькими буквами.",[["Лёгкая","Задай имя папки очков: stats.Name равно leaderstats","stats.Name = \"leaderstats\""],["Средняя","Создай IntValue в переменной coins командой Instance.new","local coins = Instance.new(\"IntValue\")"],["Сложная","Задай значение coins.Value, равное 0","coins.Value = 0"]]]];A.forEach(a=>{const[id,n,c,t,code,q,o,k,x,r,e,tk]=a;LESSONS.push({id,n,c,t,code,q,o,a:k});MORE[id]={x,r,e};TASKS[id]=tk.map(z=>[z[0],z[1],'',[[[],z[2]]]])})})();
(function(){const A=[["lu11","Lua 11. Числа и math",10,"Арифметика и случайные числа.","print(10 / 4)\nprint(10 // 4)\nprint(10 % 4)\nprint(math.random(1, 6))","Что даёт 10 % 3?",["1","3","0"],0,["Арифметика: + - * / и ^ (степень). % даёт остаток от деления, а // — целую часть. Работают скобки и приоритет, как в математике.","math.floor округляет вниз, math.random(1, 6) даёт случайное целое от 1 до 6, math.max и math.min выбирают большее и меньшее. Так делают случайный выпад предметов."],"2.5\n2\n2\n(случайное число от 1 до 6)","Ждать от math.random(6) числа от 0. Оно даёт числа от 1 до 6, нуля не будет.",[["Лёгкая","Выведи остаток от деления 17 на 5","print(17 % 5)"],["Средняя","Выведи случайное число от 1 до 10","print(math.random(1, 10))"],["Сложная","Округли 4.7 вниз и выведи","print(math.floor(4.7))"]]],["lu12","Lua 12. Логика и nil",10,"true, false и nil.","local alive = true\nlocal target = nil\nprint(alive and not target)","Что значит nil?",["Ноль","Пустую строку","Отсутствие значения"],2,["Булево значение — true или false. not меняет на противоположное, and требует, чтобы оба были true, а or хватает одного.","nil значит «ничего»: переменной не дали значение. В условии ложью считаются только false и nil, а 0 и пустая строка — истина. Поэтому проверяют так: if target then ... end."],"true","Думать, что 0 это ложь. В Lua число 0 считается истиной.",[["Лёгкая","Создай переменную isOn со значением true","local isOn = true"],["Средняя","Запиши строку: если target существует","if target then"],["Сложная","Запиши строку: если alive и не dead","if alive and not dead then"]]],["lu13","Lua 13. elseif",10,"Цепочка из нескольких условий.","local score = 75\nif score >= 90 then\n    print(\"A\")\nelseif score >= 70 then\n    print(\"B\")\nelse\n    print(\"C\")\nend","Сколько веток выполнится в цепочке if / elseif / else?",["Одна","Все","Две"],0,["Цепочка проверяет условия сверху вниз и выполняет только первую ветку, где условие истинно. Остальные пропускаются.","Поэтому порядок важен: сначала самое строгое условие. else без условия ловит всё остальное. Слово elseif пишется слитно."],"B","Написать else if раздельно. Это уже вложенный if, и ему нужен свой end.",[["Лёгкая","Запиши ветку: score больше или равно 70","elseif score >= 70 then"],["Средняя","Запиши последнюю ветку без условия","else"],["Сложная","Запиши строку, которая закрывает всю цепочку","end"]]],["lu14","Lua 14. ipairs и pairs",10,"Перебор таблицы.","local items = {\"меч\", \"щит\", \"лук\"}\nfor i, v in ipairs(items) do\n    print(i, v)\nend","Что даёт ipairs на каждом шаге?",["Только значение","Номер и значение","Только номер"],1,["for i, v in ipairs(t) do ... end перебирает таблицу по порядку: i — номер, v — значение. Так проходят по списку игроков или деталей.","pairs перебирает и таблицы с ключами, но порядок не гарантирован. Для обычных списков бери ipairs. Если номер не нужен, пиши _: for _, v in ipairs(t)."],"1 меч\n2 щит\n3 лук","Удалять элементы из таблицы прямо во время перебора. Лучше собрать список и удалить после цикла.",[["Лёгкая","Запиши заголовок перебора items через ipairs (переменные i и v)","for i, v in ipairs(items) do"],["Средняя","То же, но номер не нужен: переменные _ и item","for _, item in ipairs(items) do"],["Сложная","Запиши заголовок перебора config через pairs (переменные k и v)","for k, v in pairs(config) do"]]],["lu15","Lua 15. Таблицы с ключами",15,"Пары «ключ = значение».","local player = {name = \"Alex\", level = 3}\nprint(player.name)\nplayer.level = 4","Как получить значение по ключу name?",["player(name)","player.name","player->name"],1,["Таблица может хранить пары «ключ = значение»: {name = \"Alex\", level = 3}. Читают через точку: player.name, меняют присваиванием: player.level = 4.","Если ключ — не простое слово, пишут в скобках: player[\"best score\"]. Так хранят настройки игры, цены предметов и данные игрока."],"Alex","Писать player[name] без кавычек. Lua поищет переменную name. Для ключа-слова нужна точка или кавычки.",[["Лёгкая","Создай таблицу stats с ключом hp, равным 100","local stats = {hp = 100}"],["Средняя","Выведи значение hp из таблицы stats","print(stats.hp)"],["Сложная","Установи stats.hp равным 50","stats.hp = 50"]]],["lu16","Lua 16. task.wait и время",10,"Паузы и параллельный код.","print(\"Старт\")\ntask.wait(2)\nprint(\"Прошло 2 секунды\")","Что делает task.wait(2)?",["Останавливает всю игру","Удаляет скрипт","Ждёт 2 секунды только в этом скрипте"],2,["task.wait(секунды) приостанавливает только этот скрипт, а игра идёт дальше. Так делают таймеры, респаун и задержки между действиями.","Бесконечный цикл без task.wait() вешает игру. Ещё есть task.spawn(функция): он запускает код параллельно, не ожидая его."],"Старт\n(пауза 2 секунды)\nПрошло 2 секунды","Забыть task.wait внутри while true do. Цикл не отдаёт управление, и Studio зависает.",[["Лёгкая","Подожди 5 секунд","task.wait(5)"],["Средняя","Запиши первую строку бесконечного цикла","while true do"],["Сложная","Запусти функцию spawnCoin параллельно","task.spawn(spawnCoin)"]]],["lu17","Lua 17. Humanoid: скорость и здоровье",15,"Управление персонажем.","local humanoid = character:WaitForChild(\"Humanoid\")\nhumanoid.WalkSpeed = 32\nhumanoid.Health = 50","Какая скорость ходьбы у персонажа по умолчанию?",["32","8","16"],2,["У персонажа есть объект Humanoid. Его свойства: WalkSpeed (скорость, по умолчанию 16), JumpPower (прыжок), Health (здоровье, по умолчанию 100) и MaxHealth.","WaitForChild(\"Humanoid\") ждёт, пока объект появится, и не вызывает ошибку, если он загрузился чуть позже. Это надёжнее, чем character.Humanoid."],"Персонаж бегает вдвое быстрее, здоровье 50","Писать character.Humanoid сразу после появления персонажа. Объект может ещё не загрузиться.",[["Лёгкая","Поставь скорость 50","humanoid.WalkSpeed = 50"],["Средняя","Поставь здоровье 0","humanoid.Health = 0"],["Сложная","Получи Humanoid из character в переменную humanoid, дождавшись его","local humanoid = character:WaitForChild(\"Humanoid\")"]]],["lu18","Lua 18. Clone и Destroy",15,"Копии и удаление объектов.","local copy = template:Clone()\ncopy.Parent = workspace\ntask.wait(5)\ncopy:Destroy()","Что делает Destroy()?",["Прячет объект","Копирует объект","Удаляет объект"],2,["Clone() делает копию объекта, а Parent решает, где копия появится. Пока Parent не задан, копии нет в мире. Так создают монеты и врагов из заготовки.","Destroy() навсегда удаляет объект. Так убирают снаряды и эффекты. Если лишние объекты не удалять, они копятся, и игра начинает лагать."],"Копия появляется на 5 секунд и исчезает","Забыть задать Parent. Копия создана, но её нигде не видно.",[["Лёгкая","Скопируй template в переменную copy","local copy = template:Clone()"],["Средняя","Помести copy в workspace","copy.Parent = workspace"],["Сложная","Удали copy","copy:Destroy()"]]],["lu19","Lua 19. Сервисы GetService",15,"Готовые части Roblox.","local Players = game:GetService(\"Players\")\nlocal Lighting = game:GetService(\"Lighting\")\nLighting.ClockTime = 0","Как правильно получить сервис?",["game.Players()","get(Players)","game:GetService(\"Players\")"],2,["Сервисы — готовые части Roblox: Players (игроки), Lighting (освещение), ReplicatedStorage (общие объекты), ServerScriptService, TweenService. Их берут через game:GetService(\"Имя\").","Сервис принято сохранять в переменную в начале скрипта. Например, Lighting.ClockTime = 0 делает ночь, а 12 — полдень."],"В игре наступает ночь","Опечатка в имени сервиса. Имя в кавычках должно совпадать точно.",[["Лёгкая","Получи сервис Players в переменную Players","local Players = game:GetService(\"Players\")"],["Средняя","Получи сервис Lighting в переменную Lighting","local Lighting = game:GetService(\"Lighting\")"],["Сложная","Сделай полдень: ClockTime у Lighting равно 12","Lighting.ClockTime = 12"]]],["lu20","Lua 20. RemoteEvent: клиент и сервер",20,"Связь между игроком и сервером.","-- сервер\nremote.OnServerEvent:Connect(function(player, msg)\n    print(player.Name, msg)\nend)\n-- клиент\nremote:FireServer(\"Привет\")","Что отправляет сообщение с клиента на сервер?",["FireClient","FireServer","SendAll"],1,["В Roblox есть клиент (устройство игрока) и сервер. Они работают отдельно и общаются через RemoteEvent, который лежит в ReplicatedStorage.","Клиент вызывает remote:FireServer(данные), сервер слушает remote.OnServerEvent и первым аргументом получает игрока. Обратно сервер шлёт remote:FireClient(player, данные). Данным от клиента верить нельзя: сервер должен их проверять."],"Игрок Привет","Доверять числам от клиента. Читер может прислать что угодно, поэтому сервер обязан проверять.",[["Лёгкая","Отправь на сервер текст Hi через remote","remote:FireServer(\"Hi\")"],["Средняя","Запиши подписку сервера на remote (с player и msg)","remote.OnServerEvent:Connect(function(player, msg)"],["Сложная","Отправь с сервера игроку player число 5","remote:FireClient(player, 5)"]]]];A.forEach(a=>{const[id,n,c,t,code,q,o,k,x,r,e,tk]=a;LESSONS.push({id,n,c,t,code,q,o,a:k});MORE[id]={x,r,e};TASKS[id]=tk.map(z=>[z[0],z[1],'',[[[],z[2]]]])})})();
(function(){const A=[["lu21","Lua 21. Комментарии",5,"Заметки в коде, которые не выполняются.","-- это комментарий\nprint(\"Работает\") -- и это тоже\n--[[\nМногострочный\nкомментарий\n]]","Как начинается однострочный комментарий в Lua?",["//","--","#"],1,["Комментарий — заметка для себя и других программистов. Lua её пропускает. Однострочный начинается с двух минусов: -- текст.","Многострочный пишут между --[[ и ]]. Комментариями удобно временно выключать строки кода, чтобы проверить, что сломалось."],"Работает","Писать // как в других языках. В Lua это ошибка, комментарий начинается с --.",[["Лёгкая","Запиши комментарий с текстом старт","-- старт"],["Средняя","Закомментируй строку print(1)","-- print(1)"],["Сложная","Запиши начало многострочного комментария","--[["]]],["lu22","Lua 22. Строковые функции",10,"upper, sub, format и длина строки.","local s = \"Roblox\"\nprint(string.upper(s))\nprint(string.sub(s, 1, 3))\nprint(string.format(\"Монет: %d\", 5))","Что вернёт string.sub(\"Roblox\", 1, 3)?",["Rob","Rol","Rox"],0,["В Lua много функций для строк: string.upper делает буквы заглавными, string.lower — строчными, string.sub(s, от, до) вырезает кусок. Нумерация символов тоже с 1.","string.format подставляет значения в шаблон: %d для целого числа, %s для строки, %.2f для дроби с двумя знаками. Это удобнее, чем склеивать через .. много частей."],"ROBLOX\nRob\nМонет: 5","Вырезать с нуля: string.sub(s, 0, 3). Нумерация начинается с 1.",[["Лёгкая","Сделай строку s заглавной и выведи","print(string.upper(s))"],["Средняя","Вырежи из s первые 2 символа и выведи","print(string.sub(s, 1, 2))"],["Сложная","Выведи string.format с шаблоном \"Очки: %d\" и числом 10","print(string.format(\"Очки: %d\", 10))"]]],["lu23","Lua 23. Область видимости",10,"Где живёт local-переменная.","local a = 1\nif true then\n    local b = 2\n    print(a, b)\nend\nprint(a, b)","Что будет с b после end?",["Станет равна 2","Станет nil: за пределами блока её нет","Вызовет остановку игры"],1,["local-переменная живёт только внутри блока, где создана: функции, if, цикла. Снаружи её не видно, и обращение даст nil.","Внутренний блок видит переменные внешнего, а внешний внутренние нет. Поэтому переменные создают как можно ближе к месту использования. Если значение нужно после блока, объяви его заранее."],"1 2\n1 nil","Создать local внутри if и потом использовать снаружи. Объяви переменную до блока.",[["Лёгкая","Объяви переменную result без значения до блока","local result"],["Средняя","Запиши в result значение 5 (переменная уже объявлена)","result = 5"],["Сложная","Запиши строку, которая выводит a и b через запятую","print(a, b)"]]],["lu24","Lua 24. Vector3 и позиция",15,"Координаты и размеры в 3D.","local part = workspace.Part\npart.Position = Vector3.new(0, 10, 0)\npart.Size = Vector3.new(4, 1, 4)","Сколько чисел в Vector3?",["Два (x, y)","Четыре","Три (x, y, z)"],2,["В 3D всё задаётся тремя числами: Vector3.new(x, y, z). X — вправо-влево, Y — вверх-вниз, Z — вперёд-назад. Position задаёт место, Size задаёт размеры детали.","Детали можно двигать в цикле: part.Position += Vector3.new(0, 1, 0) поднимет деталь на 1. Чтобы деталь не падала, нужен Anchored = true."],"Деталь на высоте 10, размеры 4 на 1 на 4","Перепутать оси. Вверх это Y, а не Z.",[["Лёгкая","Поставь part в точку 0, 5, 0","part.Position = Vector3.new(0, 5, 0)"],["Средняя","Задай размер части part: 2, 2, 2","part.Size = Vector3.new(2, 2, 2)"],["Сложная","Подними part на 1 вверх оператором +=","part.Position += Vector3.new(0, 1, 0)"]]],["lu25","Lua 25. Клики и ProximityPrompt",15,"Реакция на действия игрока.","local prompt = workspace.Door.ProximityPrompt\nprompt.Triggered:Connect(function(player)\n    print(player.Name .. \" открыл дверь\")\nend)","Какое событие срабатывает, когда игрок нажал на ProximityPrompt?",["Touched","Triggered","Changed"],1,["ProximityPrompt — подсказка «нажми E», когда игрок рядом. Событие Triggered срабатывает при нажатии, а функция получает игрока: prompt.Triggered:Connect(function(player) ... end).","Есть и старый способ: ClickDetector с событием MouseClick. Он реагирует на клик по детали и тоже отдаёт игрока. Prompt удобнее, потому что работает и на телефоне."],"Имя игрока и «открыл дверь»","Подписаться на Touched вместо Triggered. Touched про касание, а не про нажатие.",[["Лёгкая","Запиши подписку на Triggered у prompt (с player)","prompt.Triggered:Connect(function(player)"],["Средняя","Запиши подписку на MouseClick у clickDetector (с player)","clickDetector.MouseClick:Connect(function(player)"],["Сложная","Выведи print с именем игрока player","print(player.Name)"]]],["lu26","Lua 26. TweenService: анимации",15,"Плавное изменение свойств.","local TweenService = game:GetService(\"TweenService\")\nlocal info = TweenInfo.new(2)\nlocal tween = TweenService:Create(part, info, {Transparency = 1})\ntween:Play()","Что делает tween:Play()?",["Создаёт деталь","Запускает анимацию","Останавливает игру"],1,["TweenService плавно меняет свойства за заданное время: цвет, прозрачность, позицию. TweenInfo.new(2) задаёт длительность 2 секунды.","TweenService:Create(объект, info, {свойство = значение}) создаёт анимацию, а tween:Play() запускает её. Так делают двери, лифты и плавное исчезновение."],"Деталь плавно исчезает за 2 секунды","Забыть вызвать Play(). Анимация создана, но не запущена.",[["Лёгкая","Создай TweenInfo на 3 секунды в переменной info","local info = TweenInfo.new(3)"],["Средняя","Создай tween для part с info и {Transparency = 1}","local tween = TweenService:Create(part, info, {Transparency = 1})"],["Сложная","Запусти tween","tween:Play()"]]],["lu27","Lua 27. ModuleScript и require",20,"Общий код, который можно подключать.","-- ModuleScript MathTools\nlocal module = {}\nfunction module.double(x)\n    return x * 2\nend\nreturn module\n\n-- другой скрипт\nlocal tools = require(script.Parent.MathTools)\nprint(tools.double(4))","Что подключает модуль в другой скрипт?",["import","require","include"],1,["ModuleScript — скрипт-библиотека. В нём создают таблицу, кладут в неё функции и в конце возвращают её: return module. Код пишут один раз и используют везде.","Подключают так: local tools = require(script.Parent.ИмяМодуля), потом вызывают tools.double(4). Модуль выполняется один раз и дальше хранится в памяти."],"8","Забыть return module в конце модуля. Тогда require вернёт ошибку.",[["Лёгкая","Создай пустую таблицу module","local module = {}"],["Средняя","Запиши в конце модуля строку, возвращающую module","return module"],["Сложная","Подключи модуль Tools из script.Parent в переменную tools","local tools = require(script.Parent.Tools)"]]],["lu28","Lua 28. pcall и ошибки",20,"Защита от падения скрипта.","local ok, err = pcall(function()\n    error(\"что-то сломалось\")\nend)\nif not ok then\n    warn(err)\nend","Что вернёт pcall при ошибке внутри функции?",["false и текст ошибки","true","Остановит весь скрипт"],0,["Если в коде случится ошибка, скрипт останавливается. pcall(функция) выполняет код безопасно и возвращает два значения: ok (true или false) и результат или текст ошибки.","pcall нужен для всего, что может сломаться без твоей вины: сохранение данных, запросы к сети. error(\"текст\") вызывает ошибку сам, а assert(условие, \"сообщение\") проверяет предположение."],"Предупреждение с текстом ошибки","Запускать DataStore без pcall. Любой сбой сервера остановит скрипт.",[["Лёгкая","Запиши начало защищённого вызова: local ok, err = pcall(function()","local ok, err = pcall(function()"],["Средняя","Выброси ошибку с текстом плохо","error(\"плохо\")"],["Сложная","Запиши условие: если ok ложно","if not ok then"]]],["lu29","Lua 29. DataStore: сохранение",20,"Сохранение данных игрока.","local DataStoreService = game:GetService(\"DataStoreService\")\nlocal store = DataStoreService:GetDataStore(\"Coins\")\nlocal ok = pcall(function()\n    store:SetAsync(player.UserId, 10)\nend)","Что обычно используют как ключ для данных игрока?",["Имя игрока","UserId","Цвет"],1,["DataStore хранит данные на серверах Roblox, поэтому они не пропадают после выхода игрока. GetDataStore(\"Имя\") открывает хранилище, SetAsync(ключ, значение) сохраняет, GetAsync(ключ) читает.","Ключом берут player.UserId: он не меняется, в отличие от имени. Все вызовы оборачивают в pcall, а в Studio включают доступ к API в настройках игры."],"Число 10 сохранено для игрока","Использовать имя игрока как ключ. Имя можно сменить, и данные потеряются.",[["Лёгкая","Открой хранилище с именем Coins в переменную store","local store = DataStoreService:GetDataStore(\"Coins\")"],["Средняя","Сохрани число 10 по ключу player.UserId","store:SetAsync(player.UserId, 10)"],["Сложная","Прочитай значение по ключу player.UserId в переменную coins","local coins = store:GetAsync(player.UserId)"]]],["lu30","Lua 30. Мини-проект: лава",20,"Собираем всё вместе: лава убивает игрока.","local lava = workspace.Lava\nlava.Touched:Connect(function(hit)\n    local humanoid = hit.Parent:FindFirstChild(\"Humanoid\")\n    if humanoid then\n        humanoid.Health = 0\n    end\nend)","Зачем искать Humanoid в hit.Parent?",["Чтобы лава работала только на персонажей","Чтобы лава краснела","Чтобы игра сохранилась"],0,["Лаву касаются не только игроки: детали, снаряды, что угодно. Поэтому по hit.Parent ищем Humanoid. Если он есть, значит, коснулся персонаж.","Дальше всё как в прошлых уроках: условие if humanoid then, и Health = 0. Попробуй дополнить проект: сделай лаву красной через BrickColor, а смерть добавь задержкой через task.wait."],"Игрок, коснувшийся лавы, погибает","Не проверять Humanoid. Тогда скрипт упадёт с ошибкой, когда лавы коснётся просто деталь.",[["Лёгкая","Найди Humanoid в hit.Parent в переменную humanoid","local humanoid = hit.Parent:FindFirstChild(\"Humanoid\")"],["Средняя","Запиши условие: если humanoid существует","if humanoid then"],["Сложная","Убей персонажа: Health равно 0","humanoid.Health = 0"]]]];A.forEach(a=>{const[id,n,c,t,code,q,o,k,x,r,e,tk]=a;LESSONS.push({id,n,c,t,code,q,o,a:k});MORE[id]={x,r,e};TASKS[id]=tk.map(z=>[z[0],z[1],'',[[[],z[2]]]])})})();
(function(){const A=[["lu31","Lua 31. ООП: setmetatable",20,"Объекты из таблиц с методами.","local Car = {}\nCar.__index = Car\nfunction Car.new(speed)\n    local self = setmetatable({}, Car)\n    self.speed = speed\n    return self\nend\nfunction Car:go()\n    print(self.speed)\nend\nCar.new(50):go()","Что даёт двоеточие в Car:go()?",["Скрытый параметр self","Комментарий","Пустую таблицу"],0,["Двоеточие в определении метода добавляет скрытый первый параметр self, то есть сам объект. Car:go() это то же, что Car.go(car).","setmetatable({}, Car) с Car.__index = Car даёт объекту методы класса. Так делают оружие, врагов и инвентарь."],"50","Вызвать Car.go() с точкой. Тогда self не передастся и будет nil.",[["Лёгкая","Создай таблицу Car","local Car = {}"],["Средняя","Задай Car.__index равным Car","Car.__index = Car"],["Сложная","Создай объект self с метатаблицей Car","local self = setmetatable({}, Car)"]]],["lu32","Lua 32. Debounce",15,"Защита от повторных срабатываний.","local debounce = false\npart.Touched:Connect(function(hit)\n    if debounce then return end\n    debounce = true\n    print(\"Касание\")\n    task.wait(1)\n    debounce = false\nend)","Зачем нужен debounce у Touched?",["Для красоты","Чтобы событие не срабатывало десятки раз подряд","Чтобы удалить деталь"],1,["Touched срабатывает много раз за одно касание. Debounce — переменная-замок: пока она true, функция выходит сразу, не делая работу.","Схема такая: проверил замок, закрыл, сделал дело, подождал, открыл. Без неё монеты и урон засчитываются по несколько раз."],"«Касание» не чаще раза в секунду","Забыть снять замок: debounce = false. Событие навсегда перестанет работать.",[["Лёгкая","Создай переменную debounce со значением false","local debounce = false"],["Средняя","Запиши выход из функции, если debounce истинна","if debounce then return end"],["Сложная","Закрой замок","debounce = true"]]],["lu33","Lua 33. Attributes",15,"Свои свойства у объектов.","part:SetAttribute(\"Damage\", 10)\nlocal d = part:GetAttribute(\"Damage\")\nprint(d)","Что делает SetAttribute?",["Создаёт или меняет свой атрибут","Удаляет объект","Печатает текст"],0,["Атрибуты — свои значения, которые можно повесить на любой объект: SetAttribute(\"Имя\", значение), GetAttribute(\"Имя\"). Их видно и меняют прямо в окне Properties.","Так хранят урон, цену, скорость: настройки лежат на самой детали, и один скрипт обслуживает много объектов."],"10","Опечатка в имени атрибута: Damage и damage разные. Имя нужно писать точно.",[["Лёгкая","Поставь на part атрибут Price равный 50","part:SetAttribute(\"Price\", 50)"],["Средняя","Прочитай атрибут Price в переменную price","local price = part:GetAttribute(\"Price\")"],["Сложная","Выведи значение атрибута Price","print(part:GetAttribute(\"Price\"))"]]],["lu34","Lua 34. CollectionService: теги",15,"Один скрипт для многих объектов.","local CollectionService = game:GetService(\"CollectionService\")\nfor _, coin in ipairs(CollectionService:GetTagged(\"Coin\")) do\n    print(coin.Name)\nend","Что делает GetTagged(\"Coin\")?",["Удаляет монеты","Возвращает все объекты с тегом Coin","Создаёт тег"],1,["Теги — метки на объектах. Поставь тег Coin на все монеты, и один скрипт найдёт их через GetTagged(\"Coin\"), даже если они разбросаны по миру.","Добавить тег в коде: CollectionService:AddTag(part, \"Coin\"). Так не нужно писать отдельный скрипт на каждую монету."],"Имя каждой монеты","Искать объекты по именам вручную. Теги надёжнее и короче.",[["Лёгкая","Получи сервис CollectionService","local CollectionService = game:GetService(\"CollectionService\")"],["Средняя","Добавь тег Coin на part","CollectionService:AddTag(part, \"Coin\")"],["Сложная","Запиши заголовок перебора всех объектов с тегом Coin (переменные _ и coin)","for _, coin in ipairs(CollectionService:GetTagged(\"Coin\")) do"]]],["lu35","Lua 35. Raycast",20,"Луч: что находится на линии.","local result = workspace:Raycast(origin, direction)\nif result then\n    print(result.Instance.Name)\nend","Что вернёт Raycast, если луч ничего не задел?",["Ошибку","nil","Ноль"],1,["Raycast пускает невидимый луч из точки origin в направлении direction и возвращает, во что он попал, или nil. Так делают выстрелы, проверку земли, прицел.","В результате есть Instance (объект), Position (точка попадания) и Normal. Всегда проверяй if result then, иначе при промахе будет ошибка."],"Имя первого объекта на линии луча","Не проверить result. При промахе будет nil, и обращение к result.Instance упадёт.",[["Лёгкая","Пусти луч из origin в direction в переменную result","local result = workspace:Raycast(origin, direction)"],["Средняя","Запиши условие: если луч во что-то попал","if result then"],["Сложная","Выведи имя объекта, в который попал луч","print(result.Instance.Name)"]]],["lu36","Lua 36. UserInputService",15,"Клавиши и касания на клиенте.","local UserInputService = game:GetService(\"UserInputService\")\nUserInputService.InputBegan:Connect(function(input, gameProcessed)\n    if gameProcessed then return end\n    if input.KeyCode == Enum.KeyCode.E then\n        print(\"Нажата E\")\n    end\nend)","Где работает UserInputService?",["Только на сервере","Только в LocalScript на клиенте","Везде одинаково"],1,["UserInputService ловит нажатия клавиш, мыши и касания. Он работает в LocalScript, то есть на устройстве игрока, потому что сервер не видит клавиатуру.","gameProcessed равен true, если нажатие уже обработал интерфейс (например, чат). Тогда лучше выйти. Клавиши берут из Enum.KeyCode."],"«Нажата E» при нажатии E","Писать такой код в обычном Script. На сервере события ввода не приходят.",[["Лёгкая","Получи сервис UserInputService","local UserInputService = game:GetService(\"UserInputService\")"],["Средняя","Запиши подписку на InputBegan (с input и gameProcessed)","UserInputService.InputBegan:Connect(function(input, gameProcessed)"],["Сложная","Запиши условие: нажата клавиша E","if input.KeyCode == Enum.KeyCode.E then"]]],["lu37","Lua 37. GUI: TextLabel",15,"Текст на экране игрока.","local label = script.Parent.TextLabel\nlabel.Text = \"Монет: 5\"\nlabel.TextColor3 = Color3.fromRGB(255, 200, 0)","Какое свойство задаёт текст надписи?",["Text","Name","Value"],0,["Интерфейс лежит в StarterGui: ScreenGui, внутри TextLabel (надпись), TextButton (кнопка), Frame (рамка). Текст меняют свойством Text.","Цвет задаёт Color3.fromRGB(r, g, b) с числами 0–255. Visible = false прячет элемент. Скрипты интерфейса пишут как LocalScript."],"Жёлтая надпись «Монет: 5»","Менять интерфейс из обычного Script на сервере. Для GUI нужен LocalScript.",[["Лёгкая","Поставь label текст Привет","label.Text = \"Привет\""],["Средняя","Спрячь label","label.Visible = false"],["Сложная","Покрась текст label в красный через Color3.fromRGB","label.TextColor3 = Color3.fromRGB(255, 0, 0)"]]],["lu38","Lua 38. Обратный отсчёт",10,"Таймер на цикле for.","for i = 10, 1, -1 do\n    print(i)\n    task.wait(1)\nend\nprint(\"Старт!\")","Что печатается после окончания цикла?",["Ничего","10","Старт!"],2,["Таймер делается циклом, который считает вниз: for i = 10, 1, -1 do ... end, а внутри task.wait(1) даёт паузу в секунду.","После цикла выполнение идёт дальше, поэтому здесь удобно запускать раунд. Число i можно показывать в TextLabel."],"10, 9, ... 1, затем «Старт!»","Забыть task.wait(1). Цикл пролетит мгновенно, и таймера не будет.",[["Лёгкая","Запиши заголовок цикла от 3 до 1 с шагом -1","for i = 3, 1, -1 do"],["Средняя","Подожди одну секунду","task.wait(1)"],["Сложная","Выведи слово Старт! после цикла","print(\"Старт!\")"]]],["lu39","Lua 39. Магазин: проверка денег",15,"Покупка и логика.","local price = 50\nif coins.Value >= price then\n    coins.Value -= price\n    print(\"Куплено\")\nelse\n    print(\"Не хватает\")\nend","Что сначала нужно сделать при покупке?",["Списать деньги","Проверить, хватает ли денег","Выдать предмет"],1,["Покупку всегда начинают с проверки: хватает ли денег. Только потом списывают цену и выдают предмет.","coins.Value -= price то же, что coins.Value = coins.Value - price. Проверку делают на сервере, иначе читер купит всё бесплатно."],"Куплено или «Не хватает»","Списать деньги до проверки. Баланс уйдёт в минус.",[["Лёгкая","Запиши условие: coins.Value не меньше price","if coins.Value >= price then"],["Средняя","Спиши цену из coins.Value оператором -=","coins.Value -= price"],["Сложная","Запиши ветку «иначе»","else"]]],["lu40","Lua 40. Мини-проект: монетки",20,"Собираем сбор монет с очками.","coin.Touched:Connect(function(hit)\n    local player = game.Players:GetPlayerFromCharacter(hit.Parent)\n    if player then\n        player.leaderstats.Coins.Value += 1\n        coin:Destroy()\n    end\nend)","Что делает GetPlayerFromCharacter?",["Создаёт игрока","Находит игрока по его персонажу","Удаляет персонажа"],1,["Монету касается деталь персонажа, а нам нужен игрок. GetPlayerFromCharacter(hit.Parent) вернёт игрока или nil, если коснулось не тело игрока.","Дальше: if player then, прибавить очко в leaderstats и Destroy() монеты. Дополни проект: debounce и звук."],"Игрок получает монету, монета исчезает","Не проверить player. Любая деталь, коснувшаяся монеты, вызовет ошибку.",[["Лёгкая","Найди игрока по персонажу hit.Parent в переменную player","local player = game.Players:GetPlayerFromCharacter(hit.Parent)"],["Средняя","Прибавь игроку одну монету в leaderstats.Coins","player.leaderstats.Coins.Value += 1"],["Сложная","Удали монету","coin:Destroy()"]]]];A.forEach(a=>{const[id,n,c,t,code,q,o,k,x,r,e,tk]=a;LESSONS.push({id,n,c,t,code,q,o,a:k});MORE[id]={x,r,e};TASKS[id]=tk.map(z=>[z[0],z[1],'',[[[],z[2]]]])})})();

(function(){const A=[{"id": "py57", "n": "Python 57. f-строки", "c": 10, "t": "Подставляем переменные прямо в текст.", "code": "name = \"Аня\"\nage = 12\nprint(f\"{name}, {age} лет\")", "q": "Какая буква перед кавычками включает подстановку {}?", "o": ["f", "s", "#"], "a": 0}, {"id": "py58", "n": "Python 58. Срезы", "c": 10, "t": "Берём часть строки или списка.", "code": "s = \"python\"\nprint(s[0:2])\nprint(s[-3:])\nprint(s[::-1])", "q": "Что даст \"python\"[1:3]?", "o": ["yt", "yth", "py"], "a": 0}, {"id": "py59", "n": "Python 59. try и except", "c": 15, "t": "Ловим ошибки, чтобы программа не падала.", "code": "try:\n    n = int(\"abc\")\nexcept ValueError:\n    print(\"Это не число\")", "q": "Какой блок выполнится, если в try случилась ошибка?", "o": ["except", "finally", "else"], "a": 0}, {"id": "py60", "n": "Python 60. Генераторы списков", "c": 15, "t": "Список в одну строку.", "code": "sq = [i * i for i in range(5)]\nprint(sq)", "q": "Что даст [i * 2 for i in range(3)]?", "o": ["[0, 2, 4]", "[2, 4, 6]", "[0, 1, 2]"], "a": 0}, {"id": "py61", "n": "Python 61. enumerate и zip", "c": 15, "t": "Номера элементов и обход двух списков сразу.", "code": "for i, x in enumerate([\"a\", \"b\"]):\n    print(i, x)\nfor a, b in zip([1, 2], [3, 4]):\n    print(a + b)", "q": "Что делает zip?", "o": ["Склеивает списки попарно", "Сортирует список", "Удаляет повторы"], "a": 0}, {"id": "py62", "n": "Python 62. Множества", "c": 15, "t": "Только уникальные элементы.", "code": "s = {1, 2, 2, 3}\nprint(len(s))\nprint(2 in s)", "q": "Сколько элементов в {1, 1, 2}?", "o": ["2", "3", "1"], "a": 0}, {"id": "py63", "n": "Python 63. lambda и sorted", "c": 15, "t": "Короткие функции и сортировка по правилу.", "code": "w = [\"ccc\", \"a\", \"bb\"]\nprint(sorted(w, key=len))\nf = lambda x: x * 2\nprint(f(4))", "q": "Что такое lambda?", "o": ["Короткая безымянная функция", "Цикл", "Модуль"], "a": 0}, {"id": "py64", "n": "Python 64. Классы", "c": 20, "t": "Свои типы данных с методами.", "code": "class Dog:\n    def __init__(self, name):\n        self.name = name\n    def say(self):\n        print(self.name, \"гав\")\n\nDog(\"Рекс\").say()", "q": "Что делает __init__?", "o": ["Задаёт начальные значения объекта", "Удаляет объект", "Печатает объект"], "a": 0}];A.forEach(l=>{if(!LESSONS.find(x=>x.id==l.id))LESSONS.push(l)});Object.assign(MORE,{"py57": {"x": ["f-строка начинается с буквы f перед кавычками. Внутри фигурных скобок можно писать переменную или выражение, Python подставит значение.", "Так проще, чем склеивать строки через + и превращать числа в текст через str()."], "r": "Аня, 12 лет", "e": "Забыть букву f: тогда фигурные скобки выведутся как обычный текст."}, "py58": {"x": ["Срез [a:b] берёт элементы от a до b, не включая b. Если a пропущено, начало с нуля, если b пропущено, до конца.", "Отрицательный индекс считает с конца: s[-1] — последний символ. Шаг -1 разворачивает: s[::-1]."], "r": "py\nhon\nnohtyp", "e": "Ждать, что правая граница входит в срез. s[0:2] даёт два символа, а не три."}, "py59": {"x": ["В try пишут код, который может упасть. Если случилась ошибка, Python переходит в except и программа продолжает работу.", "Блок finally выполняется всегда, была ошибка или нет."], "r": "Это не число", "e": "Писать except без типа ошибки: он спрячет и те ошибки, которых ты не ждал."}, "py60": {"x": ["Генератор списка собирает новый список по правилу: [выражение for элемент in последовательность]. Можно добавить условие: if в конце.", "Это короче, чем цикл с append, и обычно читается легче."], "r": "[0, 1, 4, 9, 16]", "e": "Забыть квадратные скобки: без них получится генератор, а не список."}, "py61": {"x": ["enumerate отдаёт пары (номер, элемент), удобно вместо range(len(...)). zip идёт по нескольким спискам одновременно и останавливается на самом коротком.", "Результат zip оборачивают в list(), чтобы увидеть содержимое."], "r": "0 a\n1 b\n4\n6", "e": "Писать for i in enumerate(a): тогда i будет парой, а не номером."}, "py62": {"x": ["Множество хран r.stats", "player.stats.hp"], ["Сложная", "Одной строкой: присвой player.stats.hp значение 50", "player.stats.hp = 50"]]], ["lu50", "Lua 50. and и or: значение по умолчанию", 10, "Короткий способ выбрать значение.", "local name = nil\nlocal shown = name or \"Гость\"\nprint(shown)\nlocal x = 5\nprint(x > 3 and \"много\" or \"мало\")", "Что вернёт nil or 10?", ["10", "nil", "false"], 0, ["a or b вернёт a, если оно не nil и не false, иначе b. Так задают значение по умолчанию.", "условие and A or B работает как короткое «если условие, то A, иначе B»."], "Гость\nмного", "Забыть, что 0 и пустая строка в Lua считаются истиной.", [["Лёгкая", "Что выведет print(nil or 7)? Напиши только число", "7"], ["Средняя", "Напиши print: если x > 3, то \"много\", иначе \"мало\"", "print(x > 3 and \"много\" or \"мало\")"], ["Сложная", "Одной строкой: local speed равен value, а если value пустое (nil), то 16", "local speed = value or 16"]]], ["lu51", "Lua 51. while и repeat until", 10, "Два вида цикла по условию.", "local n = 3\nwhile n > 0 do\n    print(n)\n    n = n - 1\nend\nrepeat\n    n = n + 1\nuntil n >= 2", "Когда repeat ... until останавливается?", ["Когда условие после until верно", "Когда условие ложно", "Никогда"], 0, ["while условие do ... end повторяет, пока условие верно. repeat ... until условие повторяет, пока условие не станет верным.", "repeat выполнится хотя бы один раз, потому что проверка стоит в конце."], "3\n2\n1", "Перепутать until с while: until останавливает цикл, когда условие истинно.", [["Лёгкая", "Напиши заголовок цикла: пока n больше 0", "while n > 0 do"], ["Средняя", "Напиши строку, которая завершает repeat, когда n станет 5 или больше", "until n >= 5"], ["Сложная", "Одной строкой: уменьшить n на 1", "n = n - 1"]]], ["lu52", "Lua 52. Instance.new и Parent", 10, "Создаём детали из кода.", "local part = Instance.new(\"Part\")\npart.Position = Vector3.new(0, 10, 0)\npart.Parent = workspace", "Зачем нужна строка part.Parent = workspace?", ["Чтобы деталь появил (function(){const A=[{"id": "py77", "n": "Python 77. Декораторы", "c": 20, "t": "Оборачиваем функцию в другую.", "code": "def log(f):\n    def w(*a):\n        print(\"вызов\", f.__name__)\n        return f(*a)\n    return w\n@log\ndef add(a, b):\n    return a + b\nprint(add(2, 3))", "q": "Что делает @log над функцией add?", "o": ["Заменяет add на log(add)", "Удаляет add", "Копирует add"], "a": 0}, {"id": "py78", "n": "Python 78. Генераторы и yield", "c": 20, "t": "Значения по одному, без списка в памяти.", "code": "def count(n):\n    for i in range(n):\n        yield i\nprint(list(count(3)))\ng = count(2)\nprint(next(g))\nprint(next(g))", "q": "Что делает yield?", "o": ["Отдаёт значение и запоминает место в функции", "Завершает функцию", "Печатает значение"], "a": 0}, {"id": "py79", "n": "Python 79. Контекстные менеджеры with", "c": 20, "t": "Гарантированная очистка ресурсов.", "code": "class Ctx:\n    def __enter__(self):\n        print(\"вход\")\n        return self\n    def __exit__(self, *a):\n        print(\"выход\")\nwith Ctx():\n    print(\"внутри\")", "q": "Когда вызывается __exit__?", "o": ["При выходе из with, даже при ошибке", "Только при ошибке", "При создании объекта"], "a": 0}, {"id": "py80", "n": "Python 80. dataclass", "c": 20, "t": "Класс данных без шаблонного кода.", "code": "from dataclasses import dataclass\n@dataclass\nclass P:\n    x: int\n    y: int = 0\np = P(1)\nprint(p)\nprint(p == P(1, 0))", "q": "Что даёт @dataclass?", "o": ["Сам создаёт __init__, __repr__ и __eq__", "Ускоряет программу", "Запрещает менять поля"], "a": 0}, {"id": "py81", "n": "Python 81. collections: Counter и defaultdict", "c": 20, "t": "Готовые структуры для подсчёта и группировки.", "code": "from collections import Counter, defaultdict\nprint(Counter(\"aab\").most_common(1))\nd = defaultdict(list)\nd[\"a\"].append(1)\nprint(dict(d))", "q": "Что делает defaultdict(list) при обращении к новому ключу?", "o": ["Создаёт пустой список", "Выдаёт KeyError", "Возвращает None"], "a": 0}, {"id": "py82", "n": "Python 82. itertools", "c": 20, "t": "Ленивые итераторы для сложных задач.", "code": "from itertools import chain, product\nprint(list(chain([1], [2])))\nprint(list(product(\"ab\", [1, 2]))[:2])", "q": "Что делает chain?", "o": ["Склеивает несколько последовательностей", "Сортирует список", "Удаляет повторы"], "a": 0}, {"id": "py83", "n": "Python 83. Замыкания и nonlocal", "c": 20, "t": "Функция помнит переменные снаружи.", "code": "def counter():\n    n = 0\n    def inc():\n        nonlocal n\n        n += 1\n        return n\n    return inc\nc = counter()\nprint(c())\nprint(c())", "q": "Зачем нужно nonlocal n?", "o": ["Чтобы менять n из внешней функции", "Чтобы удалить n", "Чтобы сделать n глобальной"], "a": 0}, {"id": "py84", "n": "Python 84. Аннотации типов", "c": 20, "t": "Подсказки типов для людей и инструментов.", "code": "def f(a: int, b: int = 2) -> int:\n    return a * b\nprint(f(3))\nprint(f.__annotations__[\"a\"])", "q": "Проверяет ли Python аннотации при запуске?", "o": ["Нет, это подсказки", "Да, всегда", "Только для int"], "a": 0}, {"id": "py85", "n": "Python 85. Свои исключения и finally", "c": 20, "t": "Надёжная обработка ошибок.", "code": "class MyErr(Exception):\n    pass\ntry:\n    raise MyErr(\"плохо\")\nexcept MyErr as e:\n    print(e)\nfinally:\n    print(\"конец\")", "q": "Когда выполнится finally?", "o": ["Всегда", "Только без ошибки", "Только при ошибке"], "a": 0}, {"id": "py86", "n": "Python 86. property, staticmethod, classmethod", "c": 20, "t": "Три вида методов.", "code": "class C:\n    def __init__(self, r):\n        self._r = r\n    @property\n    def area(self):\n        return self._r ** 2\n    @staticmethod\n    def hi():\n        return \"hi\"\n    @classmethod\n    def make(cls):\n        return cls(2)\nprint(C(3).area)\nprint(C.hi())\nprint(C.make().area)", "q": "Что делает @property?", "o": ["Позволяет читать метод как поле", "Делает метод приватным", "Запускает метод при создании"], "a": 0}];A.forEach(l=>{if(!LESSONS.find(x=>x.id==l.id))LESSONS.push(l)});Object.assign(MORE,{"py77": {"x": ["Декоратор — функция, которая принимает функцию и возвращает новую. Запись @log равна add = log(add).", "Внутри обёртки принимают *args, чтобы она подходила к любой функции."], "r": "вызов add\n5", "e": "Забыть вернуть обёртку из декоратора: функция станет None."}, "py78": {"x": ["Функция с yield становится генератором: каждый next() доходит до следующего yield и останавливается.", "Генераторное выражение (x*x for x in ...) не хранит весь список и экономит память."], "r": "[0, 1, 2]\n0\n1", "e": "Ждать, что генератор можно пройти дважды: он одноразовый."}, "py79": {"x": ["with вызывает __enter__ при входе и __exit__ при выходе, даже если внутри было исключение.", "Так закрывают файлы, соединения и блокировки. Короткая запись — декоратор @contextmanager."], "r": "вход\nвнутри\nвыход", "e": "Забыть закрыть ресурс без with: файл останется открытым."}, "py80": {"x": ["@dataclass по аннотациям полей генерирует __init__, __repr__ и сравнение ==.", "Значения по умолчанию задают как y: int = 0. Для списков нужен field(default_factory=list)."], "r": "P(x=1, y=0)\nTrue", "e": "Писать изменяемое значение по умолчанию (y: list = []): будет ошибка."}, "py81": {"x": ["Counter считает элементы: most_common(n) даёт n самых частых.", "defaultdict сам создаёт значение для нового ключа, поэтому группировать легко: d[k].append(v)."], "r": "[('a', 2)]\n{'a': [1]}", "e": "Забыть from collections import ...: будет NameError."}, "py82": {"x": ["chain склеивает итерируемые объекты, product даёт все пары (декартово произведение), islice берёт срез от итератора.", "Всё это ленивое: значения считаются по мере запроса."], "r": "[1, 2]\n[('a', 1), ('a', 2)]", "e": "Печатать результат без list(): увидишь объект итератора."}, "py83": {"x": ["Внутренняя функция видит переменные внешней. Чтобы их менять, нужно объявить nonlocal.", "Так делают счётчики, кеши и фабрики функций без классов."], "r": "1\n2", "e": "Забыть nonlocal: Python решит, что n локальная, и выдаст UnboundLocalError."}, "py84": {"x": ["Аннотации a: int и -> int описывают типы, но Python их не проверяет. Их читают редакторы и mypy.", "Optional[int] значит int или None. list[int] — список целых."], "r": "6\n<class 'int'>", "e": "Думать, что f(\"a\") упадёт из-за аннотации: не упадёт."}, "py85": {"x": ["Свой класс ошибки наследуют от Exception. Ловят конкретный тип, а не голый except.", "finally выполняется всегда: после успеха, после ошибки и даже после return."], "r": "плохо\nконец", "e": "Ловить except Exception везде: можно спрятать настоящую поломку."}, "py86": {"x": ["@property даёт доступ к вычисляемому значению без скобок: obj.area.", "@staticmethod не получает self, @classmethod получает класс cls и часто создаёт объекты (фабрика)."], "r": "9\nhi\n4", "e": "Вызывать property со скобками: C(3).area() даст ошибку."}});Object.assign(TASKS,{"py77": [["Лёгкая", "Создай декоратор deco(f), который возвращает f без изменений. Примени @deco к функции hi, возвращающей \"ok\". Выведи hi()", "", [[[], "ok"]]], ["Средняя", "Создай декоратор dec(f): обёртка w() возвращает f() + \"!\". Примени к функции s, возвращающей \"hi\". Выведи s()", "", [[[], "hi!"]]], ["Сложная", "Создай декоратор dbl(f): обёртка w(*a) возвращает f(*a) * 2. Примени к add(a, b), возвращающей a + b. Выведи add(2, 3)", "", [[[], "10"]]]], "py78": [["Лёгкая", "Создай генератор g(), который отдаёт 1, 2, 3. Выведи list(g())", "", [[[], "[1, 2, 3]"]]], ["Средняя", "Создай генератор sq(n), отдающий i * i для i от 0 до n - 1. Выведи list(sq(4))", "", [[[], "[0, 1, 4, 9]"]]], ["Сложная", "Выведи sum(x * x for x in range(4))", "", [[[], "14"]]]], "py79": [["Лёгкая", "Создай класс C с __enter__ (возвращает self) и __exit__(self, *a). Выведи \"ok\" внутри with C():", "", [[[], "ok"]]], ["Средняя", "Класс C: __enter__ печатает \"in\", __exit__ печатает \"out\". Выполни with C(): pass", "", [[[], "in\nout"]]], ["Сложная", "Через @contextmanager создай cm(): печатает \"a\", yield, печатает \"b\". Выполни with cm(): print(\"x\")", "", [[[], "a\nx\nb"]]]], "py80": [["Лёгкая", "Создай dataclass Item с полем name: str. Выведи Item(\"a\").name", "", [[[], "a"]]], ["Средняя", "Создай dataclass P с полями x: int и y: int. Выведи P(2, 3)", "", [[[], "P(x=2, y=3)"]]], ["Сложная", "Создай dataclass Pt с полями x и y (int). Выведи Pt(1, 2) == Pt(1, 2)", "", [[[], "True"]]]], "py81": [["Лёгкая", "Выведи Counter(\"abca\")[\"a\"]", "", [[[], "2"]]], ["Средняя", "Создай d = defaultdict(int), прибавь 1 к d[\"x\"] и выведи d[\"x\"]", "", [[[], "1"]]], ["Сложная", "Выведи Counter(\"hello\").most_common(1)", "", [[[], "[('l', 2)]"]]]], "py82": [["Лёгкая", "Выведи list(chain([1, 2], [3]))", "", [[[], "[1, 2, 3]"]]], ["Средняя", "Выведи list(islice(range(10), 3))", "", [[[], "[0, 1, 2]"]]], ["Сложная", "Выведи len(list(product(range(2), repeat=3)))", "", [[[], "8"]]]], "py83": [["Лёгкая", "Создай make(x), которая возвращает функцию f, возвращающую x. Выведи make(5)()", "", [[[], "5"]]], ["Средняя", "Создай adder(n), которая возвращает lambda x: x + n. Выведи adder(3)(4)", "", [[[], "7"]]], ["Сложная", "Создай counter() с nonlocal n, вызови полученную функцию три раза и выведи последний результат", "", [[[], "3"]]]], "py84": [["Лёгкая", "Создай f(x: int) -> int, возвращающую x + 1. Выведи f(1)", "", [[[], "2"]]], ["Средняя", "Создай f(x: int) -> int и выведи f.__annotations__[\"x\"]", "", [[[], "<class 'int'>"]]], ["Сложная", "Из typing импортируй Optional. Создай g(x: Optional[int] = None) -> int, возвращающую x or 0. Выведи g()", "", [[[], "0"]]]], "py85": [["Лёгкая", "Поймай ValueError(\"x\") и выведи его текст", "", [[[], "x"]]], ["Средняя", "Создай класс E(Exception). Подними E и в except E выведи \"caught\"", "", [[[], "caught"]]], ["Сложная", "Класс E(Exception). В try выведи 1 и подними E, в except выведи 2, в finally выведи 3 (каждое с новой строки)", "", [[[], "1\n2\n3"]]]], "py86": [["Лёгкая", "Класс A: __init__(self, x), @property d возвращает self.x * 2. Выведи A(4).d", "", [[[], "8"]]], ["Средняя", "Класс A со @staticmethod name(), возвращающим \"A\". Выведи A.name()", "", [[[], "A"]]], ["Сложная", "Класс A: __init__(self, x) и @classmethod make(cls), возвращающий cls(5). Выведи A.make().x", "", [[[], "5"]]]]})})();
(function(){const A=[{"id": "en85", "n": "English 85. Third conditional", "c": 20, "t": "Если бы в прошлом...", "code": "If I had known, I would have come.\nShe would have won if she had trained.", "q": "If I ___ earlier, I would have caught the bus.", "o": ["had left", "left", "would leave"], "a": 0}, {"id": "en86", "n": "English 86. Mixed conditionals", "c": 20, "t": "Прошлое условие, настоящий результат.", "code": "If I had studied, I would be a doctor now.\nIf I were rich, I would have bought it.", "q": "If I had studied medicine, I ___ a doctor now.", "o": ["would be", "would have been", "will be"], "a": 0}, {"id": "en87", "n": "English 87. Wish и if only", "c": 20, "t": "Сожаления и желания.", "code": "I wish I had more time.\nI wish I were taller.\nIf only I had known!", "q": "I wish I ___ more free time (сейчас его нет).", "o": ["had", "have", "would have"], "a": 0}, {"id": "en88", "n": "English 88. Догадки: must, can't, might", "c": 20, "t": "Насколько мы уверены.", "code": "He must be at home.\nShe can't be tired.\nThey might be late.", "q": "The light is on. He ___ be at home.", "o": ["must", "can't", "needn't"], "a": 0}, {"id": "en89", "n": "English 89. Пассив в разных временах", "c": 20, "t": "Is being done, has been done.", "code": "The house is being built.\nThe report has been finished.\nIt was done yesterday.", "q": "The bridge ___ now (строят прямо сейчас).", "o": ["is being built", "is built", "has built"], "a": 0}, {"id": "en90", "n": "English 90. Придаточные who, which, where", "c": 20, "t": "Определяющие и неопределяющие.", "code": "The man who called is my uncle.\nMy brother, who lives in Rome, is a doctor.", "q": "My sister, ___ lives in Rome, is a nurse.", "o": ["who", "that", "which"], "a": 0}, {"id": "en91", "n": "English 91. Герундий и инфинитив: меняют смысл", "c": 20, "t": "Stop doing или stop to do.", "code": "I stopped smoking.\nI stopped to smoke.\nRemember to call me.", "q": "I stopped ___ (бросил привычку курить).", "o": ["smoking" (function(){const A=[{"id": "py87", "n": "Python 87. lru_cache", "c": 20, "t": "Кеш результатов одной строкой.", "code": "from functools import lru_cache\n@lru_cache(maxsize=None)\ndef fib(n):\n    return n if n < 2 else fib(n - 1) + fib(n - 2)\nprint(fib(50))", "q": "Что делает @lru_cache?", "o": ["Запоминает результаты по аргументам", "Ускоряет сеть", "Проверяет типы"], "a": 0}, {"id": "py88", "n": "Python 88. Распаковка * и **", "c": 20, "t": "Разворачиваем списки и словари.", "code": "a = [1, 2]\nb = [*a, 3]\nprint(b)\nd1 = {\"x\": 1}\nd2 = {**d1, \"y\": 2}\nprint(d2)\nfirst, *rest = [1, 2, 3]\nprint(first, rest)", "q": "Что делает [*a, 3]?", "o": ["Вставляет элементы a в новый список", "Умножает список", "Удаляет a"], "a": 0}, {"id": "py89", "n": "Python 89. Словарные и множественные включения", "c": 20, "t": "Коллекции одной строкой.", "code": "sq = {i: i * i for i in range(4)}\nprint(sq)\nu = {c for c in \"aabbc\"}\nprint(sorted(u))\nprint({k: v for k, v in sq.items() if v > 1})", "q": "Что создаёт {i: i * i for i in range(3)}?", "o": ["Словарь", "Список", "Множество"], "a": 0}, {"id": "py90", "n": "Python 90. Магические методы", "c": 20, "t": "Объект ведёт себя как встроенный тип.", "code": "class Box:\n    def __init__(self, items):\n        self.items = items\n    def __len__(self):\n        return len(self.items)\n    def __getitem__(self, i):\n        return self.items[i]\n    def __eq__(self, o):\n        return self.items == o.items\nb = Box([1, 2, 3])\nprint(len(b))\nprint(b[1])\nprint(b == Box([1, 2, 3]))", "q": "Какой метод вызывается при len(obj)?", "o": ["__len__", "__size__", "__count__"], "a": 0}, {"id": "py91", "n": "Python 91. Абстрактные классы", "c": 20, "t": "Класс-контракт для наследников.", "code": "from abc import ABC, abstractmethod\nclass Shape(ABC):\n    @abstractmethod\n    def area(self):\n        pass\nclass Sq(Shape):\n    def __init__(self, a):\n        self.a = a\n    def area(self):\n        return self.a ** 2\nprint(Sq(3).area())", "q": "Что будет при создании Shape()?", "o": ["Ошибка TypeError", "Создастся объект", "Вернётся None"], "a": 0}, {"id": "py92", "n": "Python 92. functools: partial и reduce", "c": 20, "t": "Функциональные инструменты.", "code": "from functools import partial, reduce\nadd = lambda a, b: a + b\nadd5 = partial(add, 5)\nprint(add5(3))\nprint(reduce(add, [1, 2, 3, 4]))", "q": "Что делает partial(add, 5)?", "o": ["Фиксирует первый аргумент", "Удаляет аргумент", "Запускает add сразу"], "a": 0}, {"id": "py93", "n": "Python 93. Итераторы __iter__ и __next__", "c": 20, "t": "Свой объект для цикла for.", "code": "class Down:\n    def __init__(self, n):\n        self.n = n\n    def __iter__(self):\n        return self\n    def __next__(self):\n        if self.n <= 0:\n            raise StopIteration\n        self.n -= 1\n        return self.n + 1\nprint(list(Down(3)))", "q": "Что сигнализирует о конце итерации?", "o": ["StopIteration", "return None", "break"], "a": 0}, {"id": "py94", "n": "Python 94. JSON", "c": 20, "t": "Обмен данными между программами.", "code": "import json\ns = json.dumps({\"a\": 1, \"b\": [1, 2]})\nprint(s)\nd = json.loads(s)\nprint(d[\"b\"][1])", "q": "Что делает json.dumps?", "o": ["Превращает объект в строку JSON", "Читает файл", "Удаляет ключи"], "a": 0}, {"id": "py95", "n": "Python 95. Регулярные выражения", "c": 20, "t": "Поиск по шаблону в тексте.", "code": "import re\nprint(re.findall(r\"\\d+\", \"a12b345\"))\nprint(re.sub(r\"\\s+\", \" \", \"a   b    c\"))\nm = re.match(r\"(\\w+)@(\\w+)\", \"user@site\")\nprint(m.group(2))", "q": "Что значит \\d+ в шаблоне?", "o": ["Одна или больше цифр", "Одна буква", "Любой символ"], "a": 0}];A.forEach(l=>{if(!LESSONS.find(x=>x.id==l.id))LESSONS.push(l)});Object.assign(MORE,{"py87": {"x": ["lru_cache хранит результаты вызовов. Повторный вызов с теми же аргументами возвращает ответ из кеша.", "Аргументы должны быть хешируемыми: числа и строки подходят, списки нет."], "r": "12586269025", "e": "Передавать в к <script>
(function(){

const DROPS=[
 ['cup','☕','Кружка фокуса','c'],['pen','✏️','Острый карандаш','c'],['book','📖','Раскрытая книга','c'],['clk','⏰','Старый будильник','c'],['leaf','🍃','Лист концентрации','c'],['note','📝','Заметка','c'],

 ['cat','🐈','Кот-компаньон','r'],['owl','🦉','Ночная сова','r'],['fox','🦊','Хитрый лис','r'],['rock','🪨','Камень спокойствия','r'],['hour','⏳','Песочные часы','r'],['comp','🧭','Компас','r'],['moon','🌙','Лунный свет','r'],['ink','🖋️','Перо мастера','r'],
 ['fire','🔥','Огонь воли','e'],['bolt','⚡','Молния идей','e'],['gem','💠','Кристалл ясности','e'],['wolf','🐺','Волк-одиночка','e'],['lotus','🪷','Лотос тишины','e'],
 ['drag','🐉','Дракон фокуса','l'],['star','🌠','Падающая звезда','l'],['crown','👑','Корона витка','l']];

const CAT=new Map();

window.colDrop=function(dur){
  const m=Math.floor((+dur||0)/60);if(m<10)return;
  const k=today();if(S.colDay!==k){S.colDay=k;S.colN=0}
  if((S.colN||0)>=3)return;
  const ch=m>=20?1:.75;if(Math.random()>ch)return;

  let x=Math.random()*100,r='c';for(let i=0;i<4;i++){if(x<w[i]){r=ks[i];break}x-=w[i]}
  const pool=DROPS.filter(d=>d[3]==r),d=pool[Math.floor(Math.random()*pool.length)],id='d:'+d[0];

  if(sh.includes(id))sh=sh.filter(x=>x!==id);else{if(sh.length>=3){toast('В витрине максимум 3 предмета');return}sh.push(id)}

/* ---- карточки в профиле ---- */
const showIds=()=>(S.colShow||[]).filter(id=>CAT.has(id)&&own(id)).slice(0,3);
const vit=ids=>ids.length?'<div class="colv">'+ids.map(id=>{const c=CAT.get(id);return '<div class="coli'+(c.r=='l'||c.r=='e'?' rl':'')+'" style="--rc:'+RAR[c.r][1]+'"><i>'+c.e+'</i><b>'+esc(c.n)+'</b></div>'}).join('')+'</div>':'';
