(function(){const A=[{"id": "en64", "n": "English 64. Артикли a и an", "c": 15, "t": "a перед согласным звуком, an перед гласным.", "code": "a book\nan apple\nan hour\na university", "q": "I have ___ apple.", "o": ["an", "a", "the"], "a": 0}, {"id": "en65", "n": "English 65. Предлоги времени: in, on, at", "c": 15, "t": "in, on и at с временем.", "code": "at 7 o'clock\non Monday\nin the morning\nin May", "q": "I wake up ___ 7 o'clock.", "o": ["at", "in", "on"], "a": 0}, {"id": "en66", "n": "English 66. Модальные: can, must, should", "c": 15, "t": "Умею, должен, стоит.", "code": "I can swim.\nYou must stop.\nYou should rest.", "q": "You ___ stop at a red light.", "o": ["must", "can", "would"], "a": 0}, {"id": "en67", "n": "English 67. Сравнения: bigger и the biggest", "c": 15, "t": "Сравнительная и превосходная степень.", "code": "big - bigger - the biggest\ninteresting - more interesting - the most interesting\ngood - better - the best", "q": "She is ___ than me.", "o": ["taller", "tallest", "more tall"], "a": 0}, {"id": "en68", "n": "English 68. some и any", "c": 15, "t": "some в утверждениях, any в вопросах и отрицаниях.", "code": "There is some milk.\nDo you have any questions?\nI don't have any money.", "q": "I don't have ___ money.", "o": ["any", "some", "a"], "a": 0}, {"id": "en69", "n": "English 69. Вопросы с do и does", "c": 15, "t": "Как задать вопрос в Present Simple.", "code": "Do you like tea?\nDoes she work here?", "q": "___ she like tea?", "o": ["Does", "Do", "Is"], "a": 0}];A.forEach(l=>{if(!LESSONS.find(x=>x.id==l.id))LESSONS.push(l)});Object.assign(MORE,{"en64": {"x": ["Артикль a ставят перед словами, которые начинаются на согласный звук, an — перед гласным звуком: an apple, an orange.", "Смотри на звук, а не на букву: an hour (h не читается), a university (звучит «ю»)."], "r": "a / an: я имею апельсин — an orange.", "e": "Ставить a перед гласным: a apple. Правильно an apple."}, "en65": {"x": ["at — для точного времени (at 5 p.m.), on — для дней и да let upBusy=0;
async function updCheck(manual){
  const u=VU();

  try{
    const r=await fetch('https://api.github.com/repos/'+window.VITOK_REPO+'/releases/latest',{headers:{Accept:'application/vnd.github+json'},cache:'no-store'});
    if(!r.ok){if(manual)toast('Не удалось проверить обновление (код '+r.status+')');return}
    const j=await r.json(),m=/build-(\d+)/.exec(j.tag_name||''),nb=m?+m[1]:0,ap=(j.assets||[]).find(x=>/\.apk$/i.test(x.name));
    if(manual&&!m){toast('Последний релиз без номера сборки: '+(j.tag_name||'?'));return}

.colv{display:flex;gap:8px;justify-content:center;margin:2px 0 8px}
.colv .coli{width:64px;padding:8px 2px}
</style>
<script>
(function(){
'use strict';
const RAR={c:['Обычный','#9aa4ad'],r:['Редкий','#4da3ff'],e:['Эпический','#b57cff'],l:['Легендарный','#ffc83d']},RO={l:0,e:1,r:2,c:3};
const DROPS=[
 ['cup','☕','Кружка фокуса','c'],['pen','✏️','Острый карандаш','c'],['book','📖','Раскрытая книга','c'],['clk','⏰','Старый будильник','c'],['leaf','🍃','Лист концентрации','c'],['note','📝','Заметка','c'],
 ['sock','🧦','Тёплые носки','c'],['lamp','💡','Настольная лампа','c'],['plant','🪴','Горшок с ростком','c'],['hp','🎧','Наушники','c'],['bulb','🔦','Фонарик','c'],['clip','📎','Скрепка','c'],
 ['cat','🐈','Кот-компаньон','r'],['owl','🦉','Ночная сова','r'],['fox','🦊','Хитрый лис','r'],['rock','🪨','Камень спокойствия','r'],['hour','⏳','Песочные часы','r'],['comp','🧭','Компас','r'],['moon','🌙','Лунный свет','r'],['ink','🖋️','Перо мастера','r'],
 ['fire','🔥','Огонь воли','e'],['bolt','⚡','Молния идей','e'],['gem','💠','Кристалл ясности','e'],['wolf','🐺','Волк-одиночка','e'],['lotus','🪷','Лотос тишины','e'],
 ['drag','🐉','Дракон фокуса','l'],['star','🌠','Падающая звезда','l'],['crown','👑','Корона витка','l']];
const BDG=[['s7','🥉','Неделя в строю','r'],['s30','🏔️','Покоритель месяца','e'],['s100','💎','Алмазная серия','l'],['s365','👑','Годовая корона','l'],['f100','⚡','Сотня часов','r'],['f500','🏆','Полтысячи часов','e'],['f1000','🛰️','Орбита фокуса','l'],['a100','🎖️','Идеальная сотня','e'],['e25000','🏦','Банкир искр','e'],['l100','🎓','Знаток витка','r'],['se3','🥉','Призёр сезона','e'],['sew','🥇','Чемпион сезона','l'],['d5','🥊','Король дуэлей','r']];
const CAT=new Map();
DROPS.forEach(d=>CAT.set('d:'+d[0],{e:d[1],n:d[2],r:d[3],k:'d',a:d[0]}));
BDG.forEach(d=>CAT.set('b:'+d[0],{e:d[1],n:d[2],r:d[3],k:'b',a:d[0]}));
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const own=id=>{const c=CAT.get(id);if(!c)return 0;if(c.k=='b')return(S.ach&&S.ach[c.a])?1:0;return Math.max(0,Math.floor(+((S.col||{})[id])||0))};
const ownedN=()=>{let n=0;CAT.forEach((c,id)=>{if(own(id))n++});return n};
const achName=id=>{try{const a=(window.ACH||[]).find(x=>x[0]==id);return a?a[2]:id}catch(e){return id}};

/* ---- выпадение предметов за таймер ---- */
window.colDrop=function(dur){
  const m=Math.floor((+dur||0)/60);if(m<10)return;
  const k=today();if(S.colDay!==k){S.colDay=k;S.colN=0}
  if((S.colN||0)>=3)return;
  const ch=m>=20?1:.75;if(Math.random()>ch)return;
  const w=m>=90?[5,15,30,50]:m>=45?[2,10,26,62]:[.5,6.5,21,72],ks=['l','e','r','c'];
  let x=Math.random()*100,r='c';for(let i=0;i<4;i++){if(x<w[i]){r=ks[i];break}x-=w[i]}
  const pool=DROPS.filter(d=>d[3]==r),d=pool[Math.floor(Math.random()*pool.length)],id='d:'+d[0];
  S.col=S.col||{};S.col[id]=(S.col[id]||0)+1;S.colN=(S.colN||0)+1;
  toast('🎴 Выпал предмет: '+d[1]+' '+d[2]+' ('+RAR[r][0].toLowerCase()+')');
};

/* ---- окно коллекции ---- */
const cell=(id,sel,big)=>{const c=CAT.get(id),n=own(id),rc=RAR[c.r][1];
  return '<button class="coli'+(n?'':' lk')+(sel?' sel':'')+(n&&(c.r=='l'||c.r=='e')?' rl':'')+'" style="--rc:'+rc+'" data-act="colpick" data-id="'+esc(id)+'"><i>'+(n?c.e:'❔')+'</i><b>'+(n?esc(c.n):'???')+'</b>'+(n>1?'<em>×'+n+'</em>':'')+'</button>'};
function colSheet(){
  const sh=[].concat(S.colShow||[]),ids=[...CAT.keys()].sort((a,b)=>RO[CAT.get(a).r]-RO[CAT.get(b).r]||own(b)-own(a));
  let h='<h2>🎴 Коллекция <span class="m" style="font-size:14px">'+ownedN()+' из '+CAT.size+'</span></h2><p class="m">Предметы выпадают за таймеры от 10 минут (до 3 в день): 75% от 10 минут, 100% от 20, значки дают за большие достижения. Нажми на предмет, чтобы поставить его в витрину профиля (до 3).</p>';
  let last='';ids.forEach(id=>{const r=CAT.get(id).r;if(r!=last){last=r;h+=(h.indexOf('colg')>=0?'</div>':'')+'<p class="colh" style="color:'+RAR[r][1]+'">'+RAR[r][0]+'</p><div class="colg">'}h+=cell(id,sh.includes(id))});
  h+='</div><button class="btn" data-act="closesheet">Закрыть</button>';
  const s=$('#sh'),sc=s?s.scrollTop:0;open(h);const s2=$('#sh');if(s2)s2.scrollTop=sc}
function colPick(id){
  const c=CAT.get(id);if(!c)return;
  if(!own(id)){toast(c.k=='b'?'Значок за достижение «'+achName(c.a)+'»':'Выпадает за таймер от 10 минут');return}
  let sh=(S.colShow||[]).filter(x=>CAT.has(x)&&own(x));
  if(sh.includes(id))sh=sh.filter(x=>x!==id);else{if(sh.length>=3){toast('В витрине максимум 3 предмета');return}sh.push(id)}
  S.colShow=sh;save();colSheet();try{if(!$('#prof').hidden)render()}catch(e){}}

/* ---- карточки в профиле ---- */
const showIds=()=>(S.colShow||[]).filter(id=>CAT.has(id)&&own(id)).slice(0,3);
const vit=ids=>ids.length?'<div class="colv">'+ids.map(id=>{const c=CAT.get(id);return '<div class="coli'+(c.r=='l'||c.r=='e'?' rl':'')+'" style="--rc:'+RAR[c.r][1]+'"><i>'+c.e+'</i><b>'+esc(c.n)+'</b></div>'}).join('')+'</div>':'';
const _me=window.meHtml;window.meHtml=function(){let h=_me();const k='<h3 class="pf-h">Прогресс</h3>',i=h.indexOf(k);if(i<0)return h;
  return h.slice(0,i)+'<div class="card"><div style="display:flex;align-items:center;gap:10px"><p class="m" style="margin:0;flex:1">🎴 Коллекция: <b>'+ownedN()+' из '+CAT.size+'</b></p><button class="mini" data-act="colopen">Открыть</button></div>'+vit(showIds())+'</div>'+h.slice(i)};
const _fh=window.friendHtml;window.friendHtml=function(){let h=_fh();const u=FRP[FID];if(!u||!u.stats||!Array.isArray(u.stats.cs))return h;
  const ids=u.stats.cs.filter(x=>typeof x=='string'&&CAT.has(x)).slice(0,3);if(!ids.length)return h;
  const k='<h3 class="pf-h">Прогресс</h3>',j=h.indexOf(k);if(j<0)return h;
  const n=Math.max(0,Math.min(CAT.size,Math.floor(+u.stats.cn)||0));
  return h.slice(0,j)+'<div class="card" style="text-align:center"><p class="m" style="margin:0">🎴 Витрина'+(n?' · собрано '+n+' из '+CAT.size:'')+'</p>'+vit(ids)+'</div>'+h.slice(j)};
const _ms=window.myStats;window.myStats=function(){const o=_ms();o.cs=showIds();o.cn=ownedN();return o};

/* ---- клики ---- */
document.addEventListener('click',e=>{const a=e.target.closest('[data-act]');if(!a)return;const act=a.dataset.act;
  if(!['colopen','colpick'].includes(act))return;
  e.stopImmediatePropagation();
  if(act=='colopen')colSheet();else if(act=='colpick')colPick(a.dataset.id)},true);
})();
</script>

</body>
</html>
