(function(){const D={"L":[{"id":"py96","n":"Python 96. Сложность алгоритмов: Big O","c":25,"t":"Как растёт время работы при росте данных.","code":"def has_dup(a):\n    seen = set()\n    for x in a:\n        if x in seen:\n            return True\n        seen.add(x)\n    return False\n\nprint(has_dup([1, 2, 3, 1]))","q":"Какая сложность у поиска элемента в set (в среднем)?","o":["O(1)","O(n)","O(n²)"],"a":0},{"id":"py97","n":"Python 97. deque: очередь с двух сторон","c":25,"t":"Быстрая очередь вместо списка.","code":"from collections import deque\nq = deque([1, 2, 3])\nq.append(4)\nq.appendleft(0)\nprint(q.popleft(), list(q))","q":"Что делает q.popleft()?","o":["Убирает и возвращает первый элемент","Убирает последний","Копирует очередь"],"a":0},{"id":"py98","n":"Python 98. heapq: куча и приоритеты","c":25,"t":"Быстро достаём наименьший элемент.","code":"import heapq\nh = []\nfor x in [5, 1, 4, 2]:\n    heapq.heappush(h, x)\nprint(heapq.heappop(h))\nprint(heapq.nsmallest(2, [5, 1, 4, 2]))","q":"Что вернёт heappop(h)?","o":["Наименьший элемент","Наибольший элемент","Последний добавленный"],"a":0},{"id":"py99","n":"Python 99. bisect: бинарный поиск","c":25,"t":"Поиск в отсортированном списке за O(log n).","code":"import bisect\na = [10, 20, 30, 40]\nprint(bisect.bisect_left(a, 30))\nbisect.insort(a, 25)\nprint(a)","q":"Что должно быть верно для списка, чтобы bisect работал?","o":["Он отсортирован","Он содержит только числа","Он длиннее 10 элементов"],"a":0},{"id":"py100","n":"Python 100. enum: именованные константы","c":25,"t":"Набор значений вместо магических чисел.","code":"from enum import Enum\n\nclass Color(Enum):\n    RED = 1\n    GREEN = 2\n\nprint(Color.RED.name, Color.RED.value)\nprint(Color(2))","q":"Что даёт Color.RED.value?","o":["Значение 1","Строку RED","Номер по порядку"],"a":0},{"id":"py101","n":"Python 101. NamedTuple: лёгкие записи","c":25,"t":"Кортеж с именами полей и типами.","code":"from typing import NamedTuple\n\nclass Point(NamedTuple):\n    x: int\n    y: int = 0\n\np = Point(3)\nprint(p, p.x, p[1])","q":"Можно ли менять поле у NamedTuple после создания?","o":["Нет, он неизменяем","Да, как у обычного класса","Только числовые поля"],"a":0},{"id":"py102","n":"Python 102. typing: Optional, Union, Callable","c":25,"t":"Точные аннотации для сложных значений.","code":"from typing import Optional, Callable\n\ndef find(a: list[int], x: int) -> Optional[int]:\n    return a.index(x) if x in a else None\n\ndef apply(f: Callable[[int], int], v: int) -> int:\n    return f(v)\n\nprint(find([5, 6], 6), find([5, 6], 9), apply(abs, -4))","q":"Что означает Optional[int]?","o":["int или None","Только int","int или str"],"a":0},{"id":"py103","n":"Python 103. __slots__: экономим память","c":25,"t":"Объекты без словаря атрибутов.","code":"class P:\n    __slots__ = (\"x\", \"y\")\n    def __init__(self, x, y):\n        self.x = x\n        self.y = y\n\np = P(1, 2)\ntry:\n    p.z = 3\nexcept AttributeError:\n    print(\"нельзя\")","q":"Что запрещает __slots__?","o":["Добавлять новые атрибуты","Создавать объекты","Вызывать методы"],"a":0},{"id":"py104","n":"Python 104. copy и deepcopy, ловушка изменяемых аргументов","c":25,"t":"Когда копия на самом деле не копия.","code":"import copy\na = [[1], [2]]\nb = copy.copy(a)\nc = copy.deepcopy(a)\na[0].append(9)\nprint(b[0], c[0])","q":"Что делает deepcopy?","o":["Копирует вложенные объекты тоже","Копирует только верхний уровень","Удаляет оригинал"],"a":0},{"id":"py105","n":"Python 105. cached_property и functools.wraps","c":25,"t":"Вычислить один раз и не терять имя функции.","code":"from functools import cached_property, wraps\n\nclass A:\n    @cached_property\n    def val(self):\n        print(\"считаю\")\n        return 42\n\na = A()\nprint(a.val)\nprint(a.val)","q":"Сколько раз выполнится тело cached_property при двух обращениях?","o":["Один раз","Два раза","Ни разу"],"a":0},{"id":"py106","n":"Python 106. Декоратор с аргументами","c":25,"t":"Декоратор, которому можно задать настройки.","code":"from functools import wraps\n\ndef repeat(n):\n    def deco(fn):\n        @wraps(fn)\n        def wrapper(*a, **k):\n            for _ in range(n):\n                fn(*a, **k)\n        return wrapper\n    return deco\n\n@repeat(2)\ndef hi():\n    print(\"hi\")\n\nhi()","q":"Сколько уровней вложенных функций у декоратора с аргументами?","o":["Три","Один","Два"],"a":0},{"id":"py107","n":"Python 107. contextmanager: свой with за минуту","c":25,"t":"Менеджер контекста через генератор.","code":"from contextlib import contextmanager\n\n@contextmanager\ndef box():\n    print(\"открыл\")\n    try:\n        yield 1\n    finally:\n        print(\"закрыл\")\n\nwith box() as v:\n    print(\"внутри\", v)","q":"Где в генераторе выполняется код после with?","o":["После yield","До yield","Он не выполняется"],"a":0},{"id":"py108","n":"Python 108. yield from и конвейеры генераторов","c":25,"t":"Склеиваем потоки данных без списков.","code":"def nums():\n    yield from range(1, 6)\n\ndef squares(it):\n    for x in it:\n        yield x * x\n\ndef evens(it):\n    for x in it:\n        if x % 2 == 0:\n            yield x\n\nprint(list(evens(squares(nums()))))","q":"Что делает yield from range(3)?","o":["Отдаёт по очереди все элементы range","Отдаёт сам range целиком","Завершает генератор"],"a":0},{"id":"py109","n":"Python 109. pathlib: пути как объекты","c":25,"t":"Разбираем и собираем пути без строк.","code":"from pathlib import PurePath\n\np = PurePath(\"docs/report.final.txt\")\nprint(p.name)\nprint(p.stem)\nprint(p.suffix)\nprint(p.parent)\nprint(PurePath(\"a\") / \"b\" / \"c.py\")","q":"Что делает оператор / между путём и строкой?","o":["Присоединяет часть пути","Делит путь","Удаляет файл"],"a":0},{"id":"py110","n":"Python 110. datetime и timedelta","c":25,"t":"Даты и интервалы без ручных расчётов.","code":"from datetime import date, timedelta\n\nd = date(2024, 2, 28)\nprint(d + timedelta(days=2))\nprint((date(2024, 3, 1) - d).days)\nprint(d.strftime(\"%d.%m.%Y\"))\nprint(d.weekday())","q":"Что вернёт разность двух date?","o":["timedelta","date","int"],"a":0},{"id":"py111","n":"Python 111. assert и простые тесты","c":25,"t":"Проверяем функции автоматически.","code":"def add(a, b):\n    return a + b\n\ndef test_add():\n    assert add(2, 3) == 5\n    assert add(-1, 1) == 0\n\ntest_add()\nprint(\"ok\")","q":"Что сделает assert, если условие ложно?","o":["Вызовет AssertionError","Выведет False","Ничего"],"a":0},{"id":"py112","n":"Python 112. sqlite3: база в памяти","c":25,"t":"SQL прямо из Python.","code":"import sqlite3\n\ndb = sqlite3.connect(\":memory:\")\ndb.execute(\"CREATE TABLE u (name TEXT, age INT)\")\ndb.executemany(\"INSERT INTO u VALUES (?, ?)\", [(\"Аня\", 20), (\"Боб\", 17)])\nfor row in db.execute(\"SELECT name FROM u WHERE age >= ?\", (18,)):\n    print(row[0])","q":"Зачем в запросе знаки ? вместо подстановки строк?","o":["Защита от SQL-инъекций","Чтобы запрос был короче","Для ускорения"],"a":0},{"id":"py113","n":"Python 113. Паттерн Strategy: поведение как данные","c":25,"t":"Меняем алгоритм без цепочек if.","code":"ops = {\n    \"add\": lambda a, b: a + b,\n    \"mul\": lambda a, b: a * b,\n}\n\ndef calc(name, a, b):\n    return ops[name](a, b)\n\nprint(calc(\"add\", 2, 3), calc(\"mul\", 2, 3))","q":"Чем Strategy лучше длинной цепочки if/elif?","o":["Новый вариант добавляется без правки логики","Работает быстрее всегда","Короче в одну строку"],"a":0},{"id":"py114","n":"Python 114. Паттерн Observer: подписки на события","c":25,"t":"Один объект сообщает другим об изменении.","code":"class Bus:\n    def __init__(self):\n        self.subs = []\n    def on(self, fn):\n        self.subs.append(fn)\n    def emit(self, data):\n        for fn in self.subs:\n            fn(data)\n\nb = Bus()\nb.on(lambda d: print(\"A\", d))\nb.on(lambda d: print(\"B\", d))\nb.emit(5)","q":"Кто знает о подписчиках в Observer?","o":["Издатель хранит список функций","Каждый подписчик знает всех других","Никто"],"a":0},{"id":"py115","n":"Python 115. Паттерн Factory: создаём по имени","c":25,"t":"Выбор класса вынесен в одну функцию.","code":"class Cat:\n    def say(self):\n        return \"мяу\"\n\nclass Dog:\n    def say(self):\n        return \"гав\"\n\nKINDS = {\"cat\": Cat, \"dog\": Dog}\n\ndef make(kind):\n    return KINDS[kind]()\n\nprint(make(\"dog\").say())","q":"Что хранит словарь KINDS в фабрике?","o":["Сами классы","Готовые объекты","Строки с описанием"],"a":0},{"id":"py116","n":"Python 116. Внедрение зависимостей (DI)","c":25,"t":"Передаём то, что нужно, снаружи.","code":"class Greeter:\n    def __init__(self, out):\n        self.out = out\n    def hi(self, name):\n        self.out(\"Привет, \" + name)\n\nGreeter(print).hi(\"Аня\")\n\nlog = []\nGreeter(log.append).hi(\"Боб\")\nprint(log)","q":"Что даёт передача out через __init__?","o":["Можно подменить вывод в тестах","Код работает быстрее","Класс становится короче"],"a":0},{"id":"py117","n":"Python 117. Принцип единственной ответственности","c":25,"t":"Один кусок кода, одна причина меняться.","code":"def parse(line):\n    name, age = line.split(\",\")\n    return {\"name\": name, \"age\": int(age)}\n\ndef is_adult(p):\n    return p[\"age\"] >= 18\n\ndef report(p):\n    return p[\"name\"] + \": \" + (\"взрослый\" if is_adult(p) else \"ребёнок\")\n\nprint(report(parse(\"Аня,20\")))","q":"Как называется принцип «один блок — одна задача»?","o":["Single Responsibility","Open Closed","Liskov"],"a":0},{"id":"py118","n":"Python 118. Дескрипторы: __get__ и __set__","c":30,"t":"Как на самом деле работают property и методы.","code":"class Positive:\n    def __set_name__(self, owner, name):\n        self.name = \"_\" + name\n    def __get__(self, obj, owner):\n        return getattr(obj, self.name)\n    def __set__(self, obj, value):\n        if value <= 0:\n            raise ValueError(\"нужно > 0\")\n        setattr(obj, self.name, value)\n\nclass Item:\n    price = Positive()\n    def __init__(self, price):\n        self.price = price\n\nprint(Item(5).price)","q":"Какой метод вызывается при записи obj.attr = v для дескриптора?","o":["__set__","__get__","__call__"],"a":0},{"id":"py119","n":"Python 119. __init_subclass__: реестр плагинов","c":30,"t":"Класс узнаёт, что от него наследуются.","code":"class Plugin:\n    registry = {}\n    def __init_subclass__(cls, **kw):\n        super().__init_subclass__(**kw)\n        Plugin.registry[cls.__name__] = cls\n\nclass A(Plugin):\n    pass\n\nclass B(Plugin):\n    pass\n\nprint(sorted(Plugin.registry))","q":"Когда вызывается __init_subclass__?","o":["При создании подкласса","При создании объекта","При импорте модуля"],"a":0},{"id":"py120","n":"Python 120. __eq__ и __hash__: объекты в множествах","c":30,"t":"Когда два объекта считаются одинаковыми.","code":"class P:\n    def __init__(self, x, y):\n        self.x, self.y = x, y\n    def __eq__(self, o):\n        return (self.x, self.y) == (o.x, o.y)\n    def __hash__(self):\n        return hash((self.x, self.y))\n\nprint(len({P(1, 2), P(1, 2), P(2, 1)}))","q":"Почему при __eq__ нужен и __hash__?","o":["Иначе объект нельзя класть в set и ключи dict","Иначе сравнение медленное","Иначе нельзя печатать"],"a":0},{"id":"py121","n":"Python 121. operator: itemgetter и attrgetter","c":30,"t":"Быстрые ключи сортировки.","code":"from operator import itemgetter, attrgetter\n\nrows = [(\"a\", 3), (\"b\", 1), (\"c\", 2)]\nprint(sorted(rows, key=itemgetter(1)))\n\nclass U:\n    def __init__(self, n):\n        self.n = n\n\nprint([u.n for u in sorted([U(3), U(1)], key=attrgetter(\"n\"))])","q":"Что делает itemgetter(1)?","o":["Возвращает функцию, берущую элемент с индексом 1","Берёт первый элемент списка","Сортирует по индексу"],"a":0},{"id":"py122","n":"Python 122. Мини-язык форматирования: format spec","c":30,"t":"Выравнивание, точность, разделители.","code":"x = 3.14159\nn = 1234567\nprint(f\"{x:.2f}\")\nprint(f\"{n:,}\")\nprint(f\"{5:03d}\")\nprint(f\"[{'ab':>6}]\")\nprint(f\"{0.256:.1%}\")","q":"Что делает :.2f в f-строке?","o":["Два знака после запятой","Две цифры всего","Округляет до целого"],"a":0},{"id":"py123","n":"Python 123. Динамическое программирование: мемоизация","c":30,"t":"Не считаем одно и то же дважды.","code":"from functools import lru_cache\n\n@lru_cache(None)\ndef ways(n):\n    if n <= 1:\n        return 1\n    return ways(n - 1) + ways(n - 2)\n\nprint(ways(30))","q":"Что даёт мемоизация в рекурсивной задаче?","o":["Каждое подзначение считается один раз","Уменьшает число переменных","Убирает рекурсию совсем"],"a":0},{"id":"py124","n":"Python 124. Чистый код: читаемость и именование","c":30,"t":"Код читают чаще, чем пишут.","code":"def total_with_tax(prices, tax_rate):\n    subtotal = sum(prices)\n    return subtotal * (1 + tax_rate)\n\nMAX_ITEMS = 100\nprint(total_with_tax([10, 20], 0.1))","q":"Что лучше выбрать для имени функции?","o":["calc_total_with_tax","f1","x"],"a":0},{"id":"lu78","n":"Lua 78. Типизация: аннотации Luau","c":25,"t":"Подсказываем типы параметрам и результату.","code":"local function add(a: number, b: number): number\n\treturn a + b\nend\n\nlocal name: string = \"Alex\"\nprint(add(2, 3), name)","q":"Как записать, что параметр n это число?","o":["n: number","number n","n = number"],"a":0},{"id":"lu79","n":"Lua 79. --!strict и необязательные значения","c":25,"t":"Строгий режим и тип number?.","code":"--!strict\nlocal function half(n: number?): number\n\tif n == nil then\n\t\treturn 0\n\tend\n\treturn n / 2\nend\n\nprint(half(10), half(nil))","q":"Что означает number? в типе?","o":["number или nil","Только number","number или string"],"a":0},{"id":"lu80","n":"Lua 80. type: собственные типы таблиц","c":25,"t":"Описываем форму таблицы один раз.","code":"type Point = {x: number, y: number}\n\nlocal function len2(p: Point): number\n\treturn p.x * p.x + p.y * p.y\nend\n\nprint(len2({x = 3, y = 4}))","q":"Какое слово объявляет свой тип?","o":["type","class","struct"],"a":0},{"id":"lu81","n":"Lua 81. Дженерики: <T>","c":25,"t":"Одна функция для любых типов.","code":"local function first<T>(list: {T}): T?\n\treturn list[1]\nend\n\nprint(first({5, 6}), first({\"a\", \"b\"}))","q":"Что означает <T> после имени функции?","o":["Тип-параметр, подставляется при вызове","Тип возврата","Таблица"],"a":0},{"id":"lu82","n":"Lua 82. Maid/Janitor: чистим за собой","c":25,"t":"Одна точка для отписки и удаления.","code":"local Janitor = {}\nJanitor.__index = Janitor\n\nfunction Janitor.new()\n\treturn setmetatable({tasks = {}}, Janitor)\nend\n\nfunction Janitor:Add(item)\n\ttable.insert(self.tasks, item)\n\treturn item\nend\n\nfunction Janitor:Cleanup()\n\tfor _, t in ipairs(self.tasks) do\n\t\tif typeof(t) == \"RBXScriptConnection\" then\n\t\t\tt:Disconnect()\n\t\telseif typeof(t) == \"Instance\" then\n\t\t\tt:Destroy()\n\t\telseif type(t) == \"function\" then\n\t\t\tt()\n\t\tend\n\tend\n\ttable.clear(self.tasks)\nend","q":"Зачем Janitor хранит соединения и объекты в списке?","o":["Чтобы очистить всё одним вызовом","Чтобы ускорить игру","Чтобы сохранить данные"],"a":0},{"id":"lu83","n":"Lua 83. Конечный автомат: состояния врага","c":25,"t":"Поведение как набор состояний и переходов.","code":"local state = \"idle\"\nlocal transitions = {\n\tidle = \"chase\",\n\tchase = \"attack\",\n\tattack = \"idle\",\n}\n\nfor i = 1, 4 do\n\tprint(state)\n\tstate = transitions[state]\nend","q":"Что хранит таблица transitions?","o":["Следующее состояние для каждого текущего","Список врагов","Скорость"],"a":0},{"id":"lu84","n":"Lua 84. Пул объектов","c":25,"t":"Переиспользуем вместо создания и удаления.","code":"local pool = {}\n\nlocal function get()\n\tlocal obj = table.remove(pool)\n\tif obj then\n\t\treturn obj\n\tend\n\treturn {fresh = true}\nend\n\nlocal function release(obj)\n\ttable.insert(pool, obj)\nend\n\nlocal a = get()\nrelease(a)\nprint(get() == a)","q":"Что делает release в пуле?","o":["Возвращает объект в список для повторного использования","Удаляет объект навсегда","Создаёт копию"],"a":0},{"id":"lu85","n":"Lua 85. Свой Signal на таблицах","c":25,"t":"Подписки без BindableEvent.","code":"local Signal = {}\nSignal.__index = Signal\n\nfunction Signal.new()\n\treturn setmetatable({handlers = {}}, Signal)\nend\n\nfunction Signal:Connect(fn)\n\ttable.insert(self.handlers, fn)\nend\n\nfunction Signal:Fire(...)\n\tfor _, fn in ipairs(self.handlers) do\n\t\ttask.spawn(fn, ...)\n\tend\nend\n\nlocal s = Signal.new()\ns:Connect(function(x) print(\"got\", x) end)\ns:Fire(7)","q":"Зачем в Fire используется task.spawn?","o":["Чтобы ошибка в одном обработчике не остановила остальные","Для ускорения","Чтобы сигнал стал глобальным"],"a":0},{"id":"lu86","n":"Lua 86. __call: объекты-функции","c":25,"t":"Вызываем таблицу как функцию.","code":"local Counter = setmetatable({}, {\n\t__call = function(self, step)\n\t\tself.n = (self.n or 0) + step\n\t\treturn self.n\n\tend,\n})\n\nprint(Counter(2), Counter(3))","q":"Когда срабатывает __call?","o":["Когда таблицу вызывают как функцию","Когда таблицу создают","Когда таблицу печатают"],"a":0},{"id":"lu87","n":"Lua 87. __newindex: таблица только для чтения","c":25,"t":"Защищаем данные от изменений.","code":"local function readonly(t)\n\treturn setmetatable({}, {\n\t\t__index = t,\n\t\t__newindex = function()\n\t\t\terror(\"нельзя менять\", 2)\n\t\tend,\n\t})\nend\n\nlocal cfg = readonly({speed = 16})\nprint(cfg.speed)\nprint(pcall(function() cfg.speed = 100 end))","q":"Когда срабатывает __newindex?","o":["При записи в отсутствующий ключ","При чтении ключа","При удалении таблицы"],"a":0},{"id":"lu88","n":"Lua 88. __eq и __lt: сравнение объектов","c":25,"t":"Свои правила равенства и порядка.","code":"local V = {}\nV.__index = V\nV.__eq = function(a, b) return a.n == b.n end\nV.__lt = function(a, b) return a.n < b.n end\n\nlocal function new(n)\n\treturn setmetatable({n = n}, V)\nend\n\nprint(new(1) == new(1), new(1) < new(2))","q":"Какой метаметод отвечает за оператор <?","o":["__lt","__eq","__le"],"a":0},{"id":"lu89","n":"Lua 89. Слабые таблицы: __mode","c":25,"t":"Кэш, который не мешает чистке памяти.","code":"local cache = setmetatable({}, {__mode = \"k\"})\n\nlocal key = {}\ncache[key] = \"data\"\nkey = nil\ncollectgarbage()\nprint(next(cache))","q":"Что делает __mode = \"k\"?","o":["Ключи не удерживают объект в памяти","Ключи станут числами","Таблица станет только для чтения"],"a":0},{"id":"lu90","n":"Lua 90. table.freeze и table.clone","c":25,"t":"Замораживаем и копируем таблицы.","code":"local cfg = table.freeze({speed = 16, jump = 50})\nprint(table.isfrozen(cfg))\n\nlocal copy = table.clone(cfg)\ncopy.speed = 20\nprint(copy.speed, cfg.speed)","q":"Что делает table.clone?","o":["Делает поверхностную копию таблицы","Замораживает таблицу","Удаляет таблицу"],"a":0},{"id":"lu91","n":"Lua 91. table.find, table.move, table.create","c":25,"t":"Встроенные помощники для массивов.","code":"local a = {10, 20, 30}\nprint(table.find(a, 20))\n\nlocal b = table.create(3, 0)\nprint(#b, b[1])\n\ntable.move(a, 1, 3, 1, b)\nprint(b[3])","q":"Что вернёт table.find({10, 20}, 20)?","o":["2","20","true"],"a":0},{"id":"lu92","n":"Lua 92. Очередь на двух индексах","c":25,"t":"Быстрая очередь без сдвигов.","code":"local Queue = {}\nQueue.__index = Queue\n\nfunction Queue.new()\n\treturn setmetatable({first = 1, last = 0, items = {}}, Queue)\nend\n\nfunction Queue:push(v)\n\tself.last += 1\n\tself.items[self.last] = v\nend\n\nfunction Queue:pop()\n\tlocal v = self.items[self.first]\n\tself.items[self.first] = nil\n\tself.first += 1\n\treturn v\nend\n\nlocal q = Queue.new()\nq:push(\"a\")\nq:push(\"b\")\nprint(q:pop(), q:pop())","q":"Почему table.remove(t, 1) плохо для очереди?","o":["Сдвигает все элементы, это O(n)","Удаляет всю таблицу","Не работает с числами"],"a":0},{"id":"lu93","n":"Lua 93. Бинарный поиск","c":25,"t":"Ищем в отсортированном массиве за log n.","code":"local function search(a, x)\n\tlocal lo, hi = 1, #a\n\twhile lo <= hi do\n\t\tlocal mid = (lo + hi) // 2\n\t\tif a[mid] == x then\n\t\t\treturn mid\n\t\telseif a[mid] < x then\n\t\t\tlo = mid + 1\n\t\telse\n\t\t\thi = mid - 1\n\t\tend\n\tend\n\treturn nil\nend\n\nprint(search({1, 3, 5, 7, 9}, 7))","q":"Каждый шаг бинарного поиска...","o":["Отбрасывает половину диапазона","Проверяет один элемент подряд","Сортирует массив"],"a":0},{"id":"lu94","n":"Lua 94. Рекурсия: обход дерева","c":25,"t":"Дерево объектов и поиск вглубь.","code":"local function count(node)\n\tlocal n = 1\n\tfor _, child in ipairs(node.children) do\n\t\tn += count(child)\n\tend\n\treturn n\nend\n\nlocal tree = {children = {{children = {}}, {children = {{children = {}}}}}}\nprint(count(tree))","q":"Что обязательно должно быть в рекурсивной функции?","o":["Условие остановки","Глобальная переменная","Цикл while"],"a":0},{"id":"lu95","n":"Lua 95. Random.new: повторяемая случайность","c":25,"t":"Случайные числа с заданным зерном.","code":"local rng = Random.new(42)\nprint(rng:NextInteger(1, 100))\nprint(rng:NextNumber())\n\nlocal a = Random.new(7):NextInteger(1, 6)\nlocal b = Random.new(7):NextInteger(1, 6)\nprint(a == b)","q":"Что даёт одинаковое зерно (seed) в Random.new?","o":["Одинаковую последовательность","Всегда число 1","Ошибку"],"a":0},{"id":"lu96","n":"Lua 96. math.clamp и lerp","c":25,"t":"Ограничение и плавный переход.","code":"local function lerp(a, b, t)\n\treturn a + (b - a) * t\nend\n\nprint(math.clamp(15, 0, 10))\nprint(lerp(0, 100, 0.25))","q":"Что вернёт math.clamp(15, 0, 10)?","o":["10","15","0"],"a":0},{"id":"lu97","n":"Lua 97. Vector3: Dot, Cross, Magnitude","c":25,"t":"Математика направлений.","code":"local a = Vector3.new(1, 0, 0)\nlocal b = Vector3.new(0, 1, 0)\n\nprint(a:Dot(b))\nprint(a:Cross(b))\nprint((a - b).Magnitude)\nprint((b * 5).Unit)","q":"Чему равен Dot двух перпендикулярных векторов?","o":["0","1","-1"],"a":0},{"id":"lu98","n":"Lua 98. RunService: Heartbeat и PreRender","c":25,"t":"Покадровый код: где что запускать.","code":"local RunService = game:GetService(\"RunService\")\n\nlocal total = 0\nlocal conn\nconn = RunService.Heartbeat:Connect(function(dt)\n\ttotal += dt\n\tif total >= 3 then\n\t\tconn:Disconnect()\n\t\tprint(\"прошло\", math.floor(total))\n\tend\nend)","q":"Что приходит в обработчик Heartbeat?","o":["dt: время с прошлого кадра","Номер кадра","Имя игрока"],"a":0},{"id":"lu99","n":"Lua 99. Ограничение частоты запросов на сервере","c":25,"t":"Защита RemoteEvent от спама.","code":"local last = {}\n\nlocal function allowed(player, cooldown)\n\tlocal now = os.clock()\n\tif last[player] and now - last[player] < cooldown then\n\t\treturn false\n\tend\n\tlast[player] = now\n\treturn true\nend\n\nprint(allowed(\"A\", 1), allowed(\"A\", 1))","q":"Зачем серверу ограничивать частоту вызовов Remote?","o":["Чтобы клиент не завалил запросами","Чтобы сэкономить память игрока","Чтобы убрать лаг в интерфейсе"],"a":0},{"id":"lu100","n":"Lua 100. DataStore: UpdateAsync","c":25,"t":"Безопасное изменение сохранённых данных.","code":"local DS = game:GetService(\"DataStoreService\"):GetDataStore(\"Coins\")\n\nlocal ok, result = pcall(function()\n\treturn DS:UpdateAsync(\"player_1\", function(old)\n\t\told = old or 0\n\t\treturn old + 10\n\tend)\nend)\n\nprint(ok, result)","q":"Чем UpdateAsync лучше связки GetAsync + SetAsync?","o":["Изменение происходит атомарно, без потерь","Он быстрее в 10 раз","Он не требует ключа"],"a":0},{"id":"lu101","n":"Lua 101. Битовые флаги: bit32","c":25,"t":"Много «да/нет» в одном числе.","code":"local READ, WRITE, ADMIN = 1, 2, 4\n\nlocal perm = bit32.bor(READ, WRITE)\nprint(perm)\nprint(bit32.band(perm, WRITE) ~= 0)\nprint(bit32.band(perm, ADMIN) ~= 0)","q":"Что делает bit32.band(perm, WRITE) ~= 0?","o":["Проверяет, включён ли флаг WRITE","Включает флаг WRITE","Выключает флаг WRITE"],"a":0},{"id":"lu102","n":"Lua 102. task.cancel и таймауты","c":25,"t":"Останавливаем отложенные задачи.","code":"local thread = task.delay(5, function()\n\tprint(\"поздно\")\nend)\n\ntask.cancel(thread)\nprint(\"отменено\")","q":"Что возвращает task.delay?","o":["Поток, который можно отменить","Таймер в секундах","Ничего"],"a":0},{"id":"lu103","n":"Lua 103. Тесты на Lua: assert и таблицы кейсов","c":25,"t":"Проверяем функции автоматически.","code":"local function add(a, b)\n\treturn a + b\nend\n\nlocal cases = {\n\t{1, 2, 3},\n\t{0, 0, 0},\n\t{-1, 1, 0},\n}\n\nfor _, c in ipairs(cases) do\n\tassert(add(c[1], c[2]) == c[3], \"add сломалась\")\nend\nprint(\"все тесты пройдены\")","q":"Что сделает assert(false, \"ошибка\")?","o":["Остановит скрипт с сообщением","Напечатает ошибку и продолжит","Ничего"],"a":0},{"id":"en105","n":"English 105. Глаголы для передачи речи: admit, deny, suggest","c":25,"t":"После этих глаголов идёт форма с -ing.","code":"He admitted breaking the window.\nShe denied taking the money.\nI suggest going by train.","q":"She denied ___ the money.","o":["taking","to take","take"],"a":0},{"id":"en106","n":"English 106. Пассив при передаче слухов: He is said to be","c":25,"t":"Безличные конструкции: говорят, считают, сообщают.","code":"He is said to be very rich.\nThe bridge is believed to have been built in 1900.\nIt is reported that prices will rise.","q":"She is said ___ three languages.","o":["to speak","speaking","speak"],"a":0},{"id":"en107","n":"English 107. So и such: усиление","c":25,"t":"So перед прилагательным, such перед существительным.","code":"The film was so boring.\nIt was such a boring film.\nI was so tired that I fell asleep.","q":"It was ___ a nice day.","o":["such","so","very"],"a":0},{"id":"en108","n":"English 108. as ... as и the more ... the more","c":25,"t":"Равенство и «чем..., тем...».","code":"She is as tall as her brother.\nThe more you practice, the better you get.\nThe sooner, the better.","q":"The more I read, ___ I know.","o":["the more","more","the most"],"a":0},{"id":"en109","n":"English 109. Would rather и had better","c":25,"t":"Предпочтения и совет с угрозой последствий.","code":"I would rather stay home.\nYou had better hurry.\nI would rather you called me.","q":"You had better ___ now.","o":["go","to go","going"],"a":0},{"id":"en110","n":"English 110. Be used to и get used to","c":25,"t":"Привыкнуть и привыкший.","code":"I am used to getting up early.\nShe got used to the noise.\nI used to live in Rome.","q":"I am used to ___ up early.","o":["getting","get","to get"],"a":0},{"id":"en111","n":"English 111. Придаточные с запятой: which и who","c":25,"t":"Дополнительная информация, которую можно убрать.","code":"My brother, who lives in Berlin, is a doctor.\nThe film, which I saw yesterday, was great.","q":"Paris, ___ is the capital of France, is beautiful.","o":["which","that","what"],"a":0},{"id":"en112","n":"English 112. Linking words: moreover, therefore, nevertheless","c":25,"t":"Связки, которые делают речь B2.","code":"The food was cheap. Moreover, it was delicious.\nIt rained. Therefore, we stayed home.\nIt was late. Nevertheless, we went out.","q":"It was raining; ___, we went out.","o":["nevertheless","therefore","moreover"],"a":0},{"id":"en113","n":"English 113. Словообразование: суффиксы и приставки","c":25,"t":"Из одного слова пять.","code":"happy, unhappy, happiness\nuse, useful, useless\nagree, agreement, disagree\nact, active, action","q":"The noun from happy is ___.","o":["happiness","happyness","happiment"],"a":0},{"id":"en114","n":"English 114. Устойчивые сочетания: take, have, get","c":25,"t":"Какой глагол с каким существительным.","code":"take a break, take a photo\nhave a shower, have lunch\nget a job, get better","q":"I need to ___ a break.","o":["take","make","do"],"a":0},{"id":"en115","n":"English 115. Фразовые глаголы с дополнением","c":25,"t":"Где ставить it и them.","code":"Turn it off.\nPut your shoes on.\nShe picked up the phone. / She picked the phone up.","q":"Please turn ___ off.","o":["it","off it","to it"],"a":0},{"id":"en116","n":"English 116. Идиомы: образные выражения","c":25,"t":"Фразы, смысл которых не из слов.","code":"It's a piece of cake.\nBreak a leg!\nIt costs an arm and a leg.\nOnce in a blue moon.","q":"The test was a piece of ___.","o":["cake","bread","pie"],"a":0},{"id":"en117","n":"English 117. Выражаем мнение и соглашаемся","c":25,"t":"Фразы для разговора.","code":"In my opinion, it is a good idea.\nI reckon we should go.\nI totally agree.\nI see your point, but...","q":"I totally ___ with you.","o":["agree","agree to","am agree"],"a":0},{"id":"en118","n":"English 118. Формальный и неформальный стиль","c":25,"t":"Письмо другу и письмо директору.","code":"Hi Tom, thanks for your message!\nDear Sir or Madam, I am writing to enquire about...\nI look forward to hearing from you.","q":"Формальное письмо заканчивается словами «Yours ___».","o":["sincerely","truly","soon"],"a":0},{"id":"en119","n":"English 119. Собеседование: фразы и ответы","c":25,"t":"Как рассказать о себе.","code":"Tell me about yourself.\nMy greatest strength is teamwork.\nWhy do you want this job?\nI have three years of experience in sales.","q":"I have three years of ___ in sales.","o":["experience","experiment","expertise"],"a":0},{"id":"en120","n":"English 120. Путешествие: аэропорт и отель","c":25,"t":"Фразы для поездки.","code":"I would like to check in.\nWhere is the boarding gate?\nDo you have a room for two nights?\nCould I have the bill, please?","q":"I would like to ___ in.","o":["check","look","take"],"a":0},{"id":"en121","n":"English 121. У врача: симптомы и советы","c":25,"t":"Рассказываем, что болит.","code":"I have a headache.\nI feel dizzy.\nYou should take some rest.\nThe doctor prescribed antibiotics.","q":"I have a bad ___.","o":["cough","coughing","coughs"],"a":0},{"id":"en122","n":"English 122. Технологии и интернет","c":25,"t":"Слова для разговора о гаджетах.","code":"I downloaded a new app.\nMy phone battery is low.\nPlease log in to your account.\nThe Wi-Fi is down.","q":"Please ___ in to your account.","o":["log","look","take"],"a":0},{"id":"en123","n":"English 123. Экология и климат","c":25,"t":"Говорим об окружающей среде.","code":"Global warming is a serious problem.\nWe should recycle more.\nPlastic pollution harms the ocean.\nRenewable energy is the future.","q":"We should ___ plastic bottles.","o":["recycle","recover","repeat"],"a":0},{"id":"en124","n":"English 124. Артикли: когда не нужен ни a, ни the","c":25,"t":"Нулевой артикль.","code":"I love music.\nLife is short.\nShe goes to school every day.\nWe had breakfast at 8.","q":"I like ___ music.","o":["(без артикля)","the","a"],"a":0},{"id":"en125","n":"English 125. Количество: plenty of, a number of","c":25,"t":"Слова для «много» и «мало» в B2.","code":"There is plenty of time.\nA number of people came.\nHe has a great deal of experience.\nFew people know it.","q":"There is ___ of time left.","o":["plenty","plentiful","a lot"],"a":0},{"id":"en126","n":"English 126. Прилагательное + предлог","c":25,"t":"Какой предлог после прилагательного.","code":"I am afraid of spiders.\nShe is good at maths.\nHe is interested in music.\nWe are proud of you.","q":"She is good ___ maths.","o":["at","in","on"],"a":0},{"id":"en127","n":"English 127. Условия: unless, as long as, provided","c":25,"t":"Другие слова для if.","code":"I will go unless it rains.\nYou can borrow it as long as you return it.\nProvided that you pay, you can stay.","q":"I won't go ___ you come with me.","o":["unless","if not","when"],"a":0},{"id":"en128","n":"English 128. Question tags: хвостики вопроса","c":25,"t":"Проверяем, согласны ли с нами.","code":"You like coffee, don't you?\nShe isn't here, is she?\nLet's go, shall we?","q":"It is cold today, ___ it?","o":["isn't","is","doesn't"],"a":0},{"id":"en129","n":"English 129. Was going to: планы в прошлом","c":25,"t":"Хотел сделать, но не вышло.","code":"I was going to call you, but I forgot.\nThey were going to move to Spain.\nI was about to leave when you called.","q":"I ___ going to call you, but I forgot.","o":["was","am","were"],"a":0},{"id":"en130","n":"English 130. Усиление через do и did","c":25,"t":"Подчёркиваем в утверждении.","code":"I do like it!\nShe did say that.\nHe does work hard.","q":"I ___ like this song!","o":["do","am","did"],"a":0}],"MORE":{"py96":{"x":["Big O описывает, как растёт число операций при росте входных данных n. Не секунды, а форма роста: O(1) константа, O(n) линейно, O(n²) квадратично, O(log n) очень медленный рост.","Вложенные циклы по одним данным дают O(n²). Поиск x in list это O(n), а x in set или словарь это в среднем O(1). Замена списка на множество часто ускоряет код в сотни раз."],"r":"True","e":"Использовать x in список внутри цикла: получится O(n²), когда хватило бы множества."},"py97":{"x":["deque из collections быстро добавляет и убирает элементы с обоих концов за O(1). У списка pop(0) медленный: все элементы сдвигаются, это O(n).","Методы: append, appendleft, pop, popleft. deque(maxlen=3) хранит только последние 3 элемента: старые выпадают сами. Так делают историю и скользящее окно."],"r":"0 [1, 2, 3, 4]","e":"Использовать list.pop(0) для очереди на большом объёме данных: каждая операция сдвигает весь список."},"py98":{"x":["heapq превращает список в кучу: наименьший элемент всегда можно достать за O(log n). Это основа очередей с приоритетами и алгоритма Дейкстры.","heappush добавляет, heappop достаёт минимум, nsmallest(k, данные) и nlargest(k, данные) возвращают k наименьших и наибольших. Для максимума кладут числа с минусом."],"r":"1\n[1, 2]","e":"Ожидать, что сам список h отсортирован. Куча гарантирует только, что h[0] минимален."},"py99":{"x":["Бинарный поиск каждый раз делит диапазон пополам, поэтому работает за O(log n). Для миллиона элементов это около 20 шагов.","bisect_left(a, x) возвращает позицию, куда можно вставить x, не нарушив порядок. insort(a, x) вставляет сразу. Список обязан быть отсортирован, иначе результат бессмысленный."],"r":"2\n[10, 20, 25, 30, 40]","e":"Применять bisect к неотсортированному списку."},"py100":{"x":["Enum создаёт набор именованных констант. Вместо числа 2 или строки \"green\" в коде стоит Color.GREEN, и опечатку сразу видно.","У члена есть name и value. Color(2) находит член по значению, а Color[\"RED\"] по имени. Члены можно сравнивать через is и перебирать циклом for c in Color."],"r":"RED 1\nColor.GREEN","e":"Сравнивать член с числом: Color.RED == 1 даёт False. Сравнивай Color.RED.value == 1 или два члена между собой."},"py101":{"x":["NamedTuple это кортеж, у элементов которого есть имена и типы. Читается как объект (p.x), а ведёт себя как кортеж: распаковывается, сравнивается, годится в ключ словаря.","Он неизменяем: p.x = 5 вызовет ошибку. Изменённую копию делают через p._replace(x=5). Значения по умолчанию задают как у dataclass."],"r":"Point(x=3, y=0) 3 0","e":"Пытаться присвоить p.x = 5. Нужно _replace или обычный класс."},"py102":{"x":["Optional[int] это int или None. Union[int, str] это int или str, а в новых версиях Python пишут короче: int | str. Callable[[int], int] описывает функцию, принимающую int и возвращающую int.","Аннотации не проверяются при запуске, их читают редакторы и проверки типов (mypy, pyright). На больших проектах они ловят целый класс ошибок до запуска."],"r":"1 None 4","e":"Думать, что аннотации запрещают передать другой тип: Python их не проверяет сам."},"py103":{"x":["Обычный объект хранит атрибуты в словаре __dict__, это удобно, но занимает память. __slots__ заранее перечисляет поля, и словарь не создаётся.","Выигрыш заметен, когда объектов миллионы. Побочный эффект: нельзя добавить атрибут, которого нет в __slots__."],"r":"нельзя","e":"Забыть, что при наследовании от класса без __slots__ словарь всё равно появится."},"py104":{"x":["copy.copy делает поверхностную копию: внешний список новый, а вложенные объекты общие. deepcopy копирует всё вглубь.","Похожая ловушка: def f(x, a=[]) создаёт список один раз при объявлении функции, и он живёт между вызовами. Правильно: a=None и внутри if a is None: a = []."],"r":"[1, 9] [1]","e":"Писать def add(x, acc=[]): список накапливается между вызовами."},"py105":{"x":["cached_property работает как property, но результат считается при первом обращении и запоминается в объекте. Удобно для тяжёлых вычислений.","@wraps(func) внутри декоратора копирует имя и документацию исходной функции в обёртку. Без него у всех декорированных функций имя wrapper, и отладка превращается в мучение."],"r":"считаю\n42\n42","e":"Писать декоратор без @wraps: пропадают __name__ и __doc__ исходной функции."},"py106":{"x":["Декоратор с аргументами это три уровня: внешняя функция принимает настройки (repeat(n)), средняя принимает функцию (deco(fn)), внутренняя оборачивает вызов (wrapper).","@repeat(2) сначала вызывает repeat(2), получает deco, и уже deco применяется к функции. Поэтому скобки после имени обязательны."],"r":"hi\nhi","e":"Написать @repeat без скобок, когда декоратор ждёт аргумент."},"py107":{"x":["@contextmanager превращает генератор в менеджер контекста: всё до yield это вход в with, значение yield попадает в as, всё после yield это выход.","Выход нужно держать в try/finally, тогда он выполнится даже при ошибке внутри with. Так пишут блокировки, замеры времени, временную смену настроек."],"r":"открыл\nвнутри 1\nзакрыл","e":"Забыть try/finally: при ошибке внутри with код выхода не выполнится."},"py108":{"x":["yield from итерируемое передаёт все его элементы по одному, это короче цикла for x in ...: yield x.","Конвейер генераторов работает лениво: каждый элемент проходит все стадии по очереди, и в памяти нет промежуточных списков. Так обрабатывают файлы на гигабайты."],"r":"[4, 16]","e":"Вызвать list() на каждом шаге конвейера: пропадает ленивость и растёт память."},"py109":{"x":["pathlib описывает пути объектами. Оператор / склеивает части корректно для любой ОС, а свойства name, stem, suffix, parent разбирают путь без разрезания строк вручную.","PurePath только работает с путями, а Path ещё умеет читать файлы: read_text(), write_text(), exists(), iterdir(). Склейка через + и ручные слеши ломаются на другой системе."],"r":"report.final.txt\nreport.final\n.txt\ndocs\na/b/c.py","e":"Склеивать пути строками \"a\" + \"/\" + \"b\": это ломается на Windows."},"py110":{"x":["date хранит день, datetime ещё и время. Разность двух дат это timedelta, у него есть .days и .total_seconds(). К дате можно прибавить timedelta.","strftime форматирует дату в строку (%d день, %m месяц, %Y год), strptime разбирает строку обратно. weekday() даёт 0 для понедельника и 6 для воскресенья."],"r":"2024-03-01\n2\n28.02.2024\n2","e":"Считать дни вручную без учёта високосных годов."},"py111":{"x":["Тест — это маленькая программа, которая вызывает функцию и сравнивает результат с ожидаемым. assert условие падает с AssertionError, если условие ложно.","Хороший тест проверяет обычный случай, границы (пустой список, ноль) и ошибки. В реальных проектах тесты запускает pytest или unittest, но суть та же."],"r":"ok","e":"Тестировать только один удобный случай и забыть про границы: пустое значение, ноль, минус."},"py112":{"x":["sqlite3 встроен в Python. \":memory:\" создаёт базу в оперативной памяти: удобно для тестов и обучения. execute выполняет запрос, executemany вставляет много строк.","Значения никогда не подставляют в SQL строками (f\"... {x}\"): это путь к SQL-инъекции. Знак ? и кортеж параметров безопасно передают значения отдельно от кода запроса."],"r":"Аня","e":"Собирать SQL через f-строку с данными пользователя."},"py113":{"x":["Strategy выносит варианты поведения в отдельные функции или объекты. Код выбирает нужный вариант, а не знает подробностей каждого.","В Python функции это объекты, поэтому стратегия часто просто словарь функций. Новый вариант добавляется одной строкой в словарь, а вызывающий код не меняется."],"r":"5 6","e":"Растить цепочку if/elif на 20 веток: каждое изменение трогает уже работающий код."},"py114":{"x":["Observer (наблюдатель): издатель хранит список подписчиков и при событии вызывает каждого. Издателю не нужно знать, что именно делают подписчики.","Так устроены события интерфейсов, веб-хуки и шина сообщений. Подписчиков можно добавлять и убирать без правки издателя."],"r":"A 5\nB 5","e":"Вызывать конкретные функции прямо из издателя: он начинает зависеть от всех получателей."},"py115":{"x":["Фабрика создаёт объекты нужного класса по параметру. Остальной код не знает, какие классы существуют, ему важен только общий интерфейс (метод say).","В Python классы это объекты, поэтому их можно хранить в словаре и вызывать как функции: KINDS[kind](). Новый класс добавляется одной записью."],"r":"гав","e":"Хранить в словаре готовые объекты: тогда make всегда возвращает один и тот же экземпляр."},"py116":{"x":["Dependency Injection: объект не создаёт зависимости сам, а получает их снаружи. Greeter не знает, куда пишет: в print, в файл или в список.","Это главный приём для тестируемого кода: в тесте вместо базы, сети или времени подставляется простая заглушка."],"r":"Привет, Аня\n['Привет, Боб']","e":"Создавать зависимость внутри класса (подключение к базе в __init__): подменить её невозможно."},"py117":{"x":["Single Responsibility Principle: функция или класс отвечает за одну задачу и меняется по одной причине. Разбор, проверка и вывод это три отдельные функции, а не одна на сорок строк.","Мелкие функции легко тестировать и повторно использовать. Если функция называется parse_and_check_and_print, она нарушает принцип."],"r":"Аня: взрослый","e":"Собрать в одной функции чтение, расчёт и вывод: любое изменение ломает всё сразу."},"py118":{"x":["Дескриптор — объект с методами __get__, __set__ или __delete__, лежащий в классе. Python вызывает их при чтении и записи атрибута. На этом построены property, classmethod и функции-методы.","Один дескриптор можно использовать для многих полей: проверка «число больше нуля» пишется один раз и подключается к любому классу строкой price = Positive()."],"r":"5","e":"Хранить значение в самом дескрипторе: оно станет общим для всех объектов класса. Хранить нужно в obj."},"py119":{"x":["__init_subclass__ вызывается автоматически у родителя в момент объявления каждого подкласса. Родитель получает класс cls и может его запомнить или проверить.","Так делают реестры плагинов и проверки без метаклассов: достаточно унаследоваться, и класс зарегистрирован сам."],"r":"['A', 'B']","e":"Забыть вызвать super().__init_subclass__(): ломается цепочка наследования."},"py120":{"x":["Множества и словари сначала сравнивают hash, потом eq. Объекты, равные по __eq__, обязаны давать одинаковый hash. Если определить только __eq__, Python сам убирает __hash__ и объект перестаёт быть хэшируемым.","Правило: hash строится только из неизменяемых полей. Если поля меняются после попадания в set, объект «теряется» в нём."],"r":"2","e":"Определить __eq__ без __hash__: TypeError: unhashable type при добавлении в set."},"py121":{"x":["itemgetter(i) создаёт функцию, которая берёт x[i]. attrgetter(\"n\") создаёт функцию, которая берёт x.n. Это быстрее и читаемее lambda x: x[1] в ключах sorted, min, max.","itemgetter принимает несколько индексов и возвращает кортеж: itemgetter(1, 0). Так сортируют по нескольким полям."],"r":"[('b', 1), ('c', 2), ('a', 3)]\n[1, 3]","e":"Путать itemgetter (индексы и ключи) и attrgetter (атрибуты объектов)."},"py122":{"x":["После двоеточия в f-строке идёт спецификация: :.2f это число с двумя знаками после точки, :, добавляет разделители тысяч, :03d дополняет нулями до трёх цифр, :>6 выравнивает по правому краю в шесть символов, :.1% показывает процент.","Эти же спецификации работают в format() и str.format. Они избавляют от ручной возни со строками при выводе таблиц и отчётов."],"r":"3.14\n1,234,567\n005\n[    ab]\n25.6%","e":"Использовать round() только ради вывода: round(2.5, 0) и :.0f дают разное из-за округления «к чётному»."},"py123":{"x":["Динамическое программирование: большая задача сводится к похожим маленьким, ответ на каждую запоминается. Без запоминания ways(30) вызвала бы себя миллионы раз, с запоминанием лишь 30.","Два пути: рекурсия с @lru_cache сверху вниз или таблица снизу вверх циклом. Оба дают O(n) вместо экспоненты."],"r":"1346269","e":"Писать наивную рекурсию Фибоначчи на n = 40: тысячи секунд вместо долей секунды."},"py124":{"x":["Хорошее имя объясняет назначение без комментария: total_with_tax понятнее, чем f или calc. Функции называют глаголами, константы заглавными буквами, булевы значения вопросами (is_ready).","Правила: одна функция одна задача, до 20 строк, без магических чисел (вынеси в константу), ранний return вместо глубокой вложенности. Это облегчает ревью и поиск ошибок."],"r":"33.0","e":"Оставлять магические числа в коде: через месяц никто не помнит, что значит 86400."},"lu78":{"x":["Luau позволяет писать типы после двоеточия: параметр (a: number), результат функции (): number, переменная (local x: string). Студия подчёркивает ошибки типов ещё до запуска игры.","Основные типы: number, string, boolean, nil, any. Типы нужны для редактора и проверок, на скорость игры они почти не влияют. На больших проектах это главная защита от опечаток."],"r":"5\tAlex","e":"Писать тип перед именем, как в C++: пишется name: type."},"lu79":{"x":["Первая строка --!strict включает строгую проверку типов в скрипте. Редактор потребует точные типы везде и покажет, где значение может оказаться nil.","Знак ? после типа делает его необязательным: number? это number или nil. Перед использованием значение нужно проверить на nil, тогда строгий режим понимает, что дальше это уже number."],"r":"5\t0","e":"Использовать number? как обычное число без проверки: строгий режим покажет предупреждение."},"lu80":{"x":["type Имя = {...} даёт короткое имя для формы таблицы. Дальше его пишут в аннотациях вместо длинного описания.","В модулях тип экспортируют: export type Point = {...}. Тогда другие скрипты могут писать Module.Point. Необязательное поле отмечают знаком ?: {name: string, age: number?}."],"r":"25","e":"Опечататься в имени поля: в строгом режиме это подсветится сразу."},"lu81":{"x":["Дженерик — параметр типа. first<T> работает для списка чисел, строк и чего угодно, а результат получает тот же тип T.","{T} это массив элементов типа T, T? это T или nil. Дженерики пишут для универсальных помощников: map, filter, find, очередей."],"r":"5\ta","e":"Писать any вместо T: редактор перестаёт отслеживать тип результата."},"lu82":{"x":["Каждое подключение события и каждый созданный объект надо убрать, иначе остаются «утечки»: скрипты продолжают работать после смерти объекта. Janitor (или Maid) собирает всё в один список.","Cleanup() проходит по списку: соединение отключает, Instance уничтожает, функцию вызывает. Так при удалении игрока или врага достаточно одного вызова janitor:Cleanup()."],"r":"(ничего не печатает)","e":"Забыть Disconnect у события: после удаления объекта обработчик продолжает висеть в памяти."},"lu83":{"x":["Конечный автомат (state machine): у объекта есть одно текущее состояние и правила перехода. Враг не «думает обо всём сразу», а каждую секунду выполняет код своего состояния.","Состояния проще всего хранить строками, переходы таблицей или функциями. Так легко добавить новое состояние: одна запись вместо цепочки if."],"r":"idle\nchase\nattack\nidle","e":"Хранить состояние сразу в нескольких булевых переменных: можно получить невозможное сочетание."},"lu84":{"x":["Создание и удаление сотен деталей (пули, эффекты) нагружает игру. Пул хранит ненужные объекты и выдаёт их снова вместо создания новых.","get() достаёт объект из пула, а если пусто создаёт. release(obj) прячет объект и кладёт обратно. Так делают пули, монеты, всплывающие цифры урона."],"r":"true","e":"Забыть сбросить состояние объекта перед повторной выдачей: вылезут следы прошлого использования."},"lu85":{"x":["Signal хранит список функций. Connect добавляет, Fire вызывает каждую с переданными значениями. ... передаёт любое количество аргументов.","task.spawn запускает каждый обработчик отдельно: ошибка или task.wait в одном не остановит остальные. Такой Signal быстрее BindableEvent, потому что значения не копируются."],"r":"got\t7","e":"Вызвать обработчик напрямую в цикле: ошибка в одном ломает все следующие."},"lu86":{"x":["Метаметод __call позволяет писать obj(...), хотя obj таблица. Первым параметром приходит сама таблица, дальше аргументы вызова.","Так делают конструкторы классов (Class(...) вместо Class.new(...)) и объекты с настройками, которые ведут себя как функции."],"r":"2\t5","e":"Забыть первый параметр self в функции __call: аргументы сдвигаются."},"lu87":{"x":["__index вызывается при чтении отсутствующего ключа, __newindex при записи. Если оставить прокси-таблицу пустой, а данные держать в другой, любая запись пойдёт через __newindex, и её можно запретить.","Для настоящих констант есть и table.freeze(t): запись в замороженную таблицу сразу вызывает ошибку. Прокси нужен, когда надо кастомное сообщение или логирование."],"r":"16\nfalse\t...нельзя менять","e":"Записывать в сам прокси через rawset: защита обходится."},"lu88":{"x":["__eq определяет ==, __lt определяет <, __le определяет <=. Без них две разные таблицы с одинаковыми полями не равны: == сравнивает ссылки.","__eq вызывается, только если обе таблицы с метаметодом. Сортировка table.sort использует <, поэтому с __lt можно сортировать объекты без своей функции сравнения."],"r":"true\ttrue","e":"Ожидать, что == сравнит содержимое таблиц без __eq."},"lu89":{"x":["Обычная таблица держит свои ключи и значения «в памяти» навсегда. Слабая таблица (__mode) нет: если на объект больше нигде нет ссылок, сборщик мусора удалит его и из таблицы.","\"k\" слабые ключи, \"v\" слабые значения, \"kv\" оба. Идеально для кэшей и данных, привязанных к объектам: игрок вышел, запись исчезла сама."],"r":"nil","e":"Использовать обычную таблицу для данных об объектах: после удаления объекта запись остаётся навсегда."},"lu90":{"x":["table.freeze(t) запрещает менять таблицу: любая запись вызовет ошибку. table.isfrozen(t) проверяет. Идеально для настроек и констант.","table.clone(t) копирует таблицу, причём копия не заморожена. Копия поверхностная: вложенные таблицы остаются общими, их надо копировать отдельно."],"r":"true\n20\t16","e":"Думать, что clone копирует вложенные таблицы: они общие у оригинала и копии."},"lu91":{"x":["table.find(t, v) возвращает индекс первого найденного значения или nil. table.create(n, value) заранее создаёт массив из n значений, это быстрее, чем растить по одному.","table.move(источник, от, до, куда, приёмник) копирует кусок массива. Так вставляют и сдвигают элементы без циклов."],"r":"2\n3\t0\n30","e":"Использовать table.find для словарей: он работает только по индексам массива."},"lu92":{"x":["table.remove(t, 1) сдвигает все остальные элементы на шаг влево: на больших очередях это медленно. Очередь на двух индексах (first и last) не двигает ничего: push пишет в конец, pop читает с начала.","Составные операторы += и -= есть в Luau. Для стека хватает table.insert и table.remove без индекса, они работают с концом списка за O(1)."],"r":"a\tb","e":"Забыть обнулить элемент после pop: память не освобождается."},"lu93":{"x":["Бинарный поиск смотрит на середину: если искомое больше, оставляет правую половину, иначе левую. Для миллиона элементов хватит около 20 шагов.","// в Luau это целочисленное деление, (lo + hi) // 2 даёт середину. Массив обязан быть отсортирован."],"r":"4","e":"Вызвать бинарный поиск на неотсортированном массиве: результат случайный."},"lu94":{"x":["Рекурсия это функция, вызывающая саму себя. Для дерева: обработай текущий узел, затем вызови ту же функцию для каждого ребёнка. Условие остановки здесь это узел без детей: цикл просто не выполняется.","В Roblox так обходят иерархию: у Instance есть GetDescendants(), но свой обход пригодится для меню, диалогов, деревьев умений."],"r":"4","e":"Забыть условие остановки: получится бесконечная рекурсия и «stack overflow»."},"lu95":{"x":["Random.new(seed) создаёт генератор с заданным зерном: при одном и том же seed числа идут в одном и том же порядке. Это нужно для карт, которые должны одинаково строиться у всех игроков.","Методы: NextInteger(a, b) целое от a до b, NextNumber() дробное от 0 до 1, NextNumber(a, b) дробное в диапазоне. Без зерна Random.new() каждый раз новая последовательность."],"r":"...\n...\ntrue","e":"Вызывать Random.new внутри цикла каждый раз: числа повторяются."},"lu96":{"x":["math.clamp(x, min, max) не даёт x выйти за границы. Нужно для здоровья, громкости, камеры.","lerp(a, b, t) плавно переходит от a к b: при t = 0 даёт a, при t = 1 даёт b, при 0.5 середину. У Vector3 и CFrame есть готовый метод :Lerp(другой, t)."],"r":"10\n25","e":"Писать min(max(x, lo), hi) вручную: в Luau есть готовый clamp."},"lu97":{"x":["Magnitude длина вектора, Unit тот же вектор длиной 1 (направление). Расстояние между точками: (a - b).Magnitude.","Dot (скалярное произведение) даёт 1 для одного направления, 0 для перпендикулярных и -1 для противоположных. Так проверяют, смотрит ли враг на игрока. Cross возвращает вектор, перпендикулярный обоим."],"r":"0\n0, 0, 1\n1.4142...\n0, 1, 0","e":"Путать Dot (число) и Cross (вектор)."},"lu98":{"x":["Heartbeat срабатывает каждый кадр после физики, на сервере и на клиенте. dt секунды с прошлого кадра: умножай скорость на dt, чтобы игра шла одинаково на любом FPS.","PreRender (только клиент) выполняется перед отрисовкой: подходит для камеры и интерфейса. Stepped (PreSimulation) идёт перед физикой. Ненужное подключение обязательно отключай через :Disconnect()."],"r":"прошло\t3","e":"Двигать объект на фиксированный шаг каждый кадр, не умножая на dt: на быстрых компьютерах всё быстрее."},"lu99":{"x":["Клиент может вызвать RemoteEvent сколько угодно раз в секунду, даже тысячи (эксплойтер). Сервер хранит время последнего вызова каждого игрока и отклоняет слишком частые.","Кулдаун это только часть защиты. Сервер также проверяет тип и диапазон данных и никогда не верит значениям от клиента. Таблицу last чистят при выходе игрока через PlayerRemoving."],"r":"true\tfalse","e":"Доверять клиенту: проверка «можно ли» должна быть на сервере."},"lu100":{"x":["UpdateAsync получает текущее значение и возвращает новое. Если данные изменились в другом сервере между чтением и записью, Roblox вызовет функцию заново: ничего не потеряется.","Все запросы к DataStore нужно оборачивать в pcall: они могут завершиться ошибкой из-за сети или лимитов. Функция внутри UpdateAsync должна быть быстрой и без task.wait. Если вернуть nil, запись отменяется."],"r":"true\t10","e":"Читать, менять и записывать отдельными вызовами: при двух серверах теряются изменения."},"lu101":{"x":["Флаги хранят несколько включённых/выключенных свойств в одном числе: каждый флаг это степень двойки (1, 2, 4, 8). bit32.bor объединяет флаги, bit32.band проверяет, есть ли флаг.","Выключить флаг: bit32.band(perm, bit32.bnot(FLAG)). Так хранят права доступа, настройки и состояния экономно, одним числом в DataStore."],"r":"3\ntrue\nfalse","e":"Использовать обычные числа 1, 2, 3: 3 это уже сумма 1 и 2, флаги должны быть степенями двойки."},"lu102":{"x":["task.spawn, task.defer и task.delay возвращают поток (thread). Его можно остановить через task.cancel(thread), пока он не выполнился.","Так делают таймауты и «сбрасываемые» задержки: новое нажатие отменяет старую задачу и запускает новую. Не отменяй поток, который отменяет сам себя: используй return."],"r":"отменено","e":"Забыть отменить старый task.delay: задачи накапливаются и срабатывают все."},"lu103":{"x":["assert(условие, сообщение) вызывает ошибку, если условие ложно. Простейший тест это функция, которую вызывают с известными данными и сравнивают результат с ожидаемым.","Тесты складывают в таблицу кейсов: вход и ожидаемый результат. Новый баг превращается в новую строку таблицы, и больше не вернётся незамеченным. В Roblox для больших проектов есть TestEZ и Jest-Lua."],"r":"все тесты пройдены","e":"Проверять только удобные данные: границы (0, пусто, максимум) ломаются чаще всего."},"en105":{"x":["Глаголы admit (признавать), deny (отрицать), suggest (предлагать), recommend (советовать), mention (упомянуть) требуют после себя форму с -ing: He admitted lying.","Можно и с that: He admitted that he had lied. Но через -ing короче и звучит естественнее. Не говорят: He suggested to go."],"r":"Он признал, что разбил окно. Она отрицала, что брала деньги. Я предлагаю поехать на поезде.","e":"He suggested to go. После suggest нужно -ing: He suggested going."},"en106":{"x":["Для общеизвестного, но непроверенного: He is said to be... (Говорят, что он...). Такая форма звучит как в новостях. Глаголы: say, believe, think, know, report, expect.","Про прошлое используют perfect infinitive: He is said to have left (Говорят, что он уехал). Вариант с it: It is said that he is rich."],"r":"Говорят, что он очень богат. Считается, что мост построили в 1900 году. Сообщают, что цены вырастут.","e":"He is said that he is rich. Смешали два варианта: либо He is said to be, либо It is said that he is."},"en107":{"x":["So ставят перед прилагательным или наречием: so good, so fast. Such ставят перед существительным (с прилагательным или без): such a day, such good people.","Результат вводит that: He was so tired that he slept all day. Такое же значение у such ... that: It was such a long day that I was exhausted."],"r":"Фильм был таким скучным. Это был такой скучный фильм. Я так устал, что заснул.","e":"It was so a nice day. Перед a + существительное нужно such."},"en108":{"x":["as + прилагательное + as: равенство (as fast as). Отрицание: not as ... as, то есть «не такой, как».","Конструкция the + сравнительная ..., the + сравнительная ... значит «чем ..., тем ...»: The harder you work, the more you earn."],"r":"Она такого же роста, как её брат. Чем больше практикуешься, тем лучше становишься. Чем скорее, тем лучше.","e":"The more I read, more I know. Перед вторым сравнением нужен the."},"en109":{"x":["Would rather + глагол без to: I would rather walk (Я бы лучше прошёл пешком). Вопрос: Would you rather tea or coffee?","Had better + глагол без to: совет, при этом «иначе будут проблемы»: You had better leave (Тебе лучше уйти). Отрицание: had better not."],"r":"Я бы лучше остался дома. Тебе лучше поторопиться. Я бы предпочёл, чтобы ты мне позвонил.","e":"You had better to go. После had better и would rather нет to."},"en110":{"x":["be used to + -ing или существительное: быть привыкшим (состояние). I am used to the cold. get used to: привыкать (процесс).","Не путай с used to + глагол, это прошлая привычка: I used to smoke (раньше я курил)."],"r":"Я привык рано вставать. Она привыкла к шуму. Раньше я жил в Риме.","e":"I am used to get up. После be used to нужно -ing: getting."},"en111":{"x":["Придаточное с запятыми (non-defining) добавляет дополнительную информацию. Без него предложение остаётся понятным. Используют who (люди), which (вещи), whose, where.","That в таких придаточных не употребляется. Запятые обязательны с двух сторон: My car, which is red, is fast."],"r":"Мой брат, который живёт в Берлине, врач. Фильм, который я смотрел вчера, был отличный.","e":"My car, that is red. В придаточном с запятыми that не ставят, только which или who."},"en112":{"x":["Moreover и furthermore добавляют ещё один аргумент. Therefore и as a result показывают следствие. However и nevertheless показывают контраст («однако», «тем не менее»).","Такие слова ставят в начале предложения с запятой после них или после точки с запятой. В неформальной речи проще: and, so, but."],"r":"Еда была дешёвой. Более того, она была вкусной. Шёл дождь. Поэтому мы остались дома. Было поздно. Тем не менее мы вышли.","e":"Therefore ставят там, где нужен контраст: путают причину (therefore) и контраст (nevertheless)."},"en113":{"x":["Суффиксы -ness, -ment, -tion образуют существительные (kind → kindness, agree → agreement, create → creation). Суффиксы -ful и -less прилагательные «полный» и «без» (use → useful, useless).","Приставки un-, dis-, im-, in- придают противоположный смысл: unhappy, disagree, impossible, incorrect. Знание частей слова помогает угадать значение незнакомых слов."],"r":"Счастливый, несчастный, счастье. Польза, полезный, бесполезный. Соглашаться, согласие, не соглашаться.","e":"Писать happyness. При добавлении -ness после y буква меняется на i: happiness."},"en114":{"x":["С take: take a break, take a photo, take a bus, take a chance. С have: have a shower, have lunch, have fun, have a look. С get: get a job, get tired, get home.","Эти сочетания учат целиком, а не по словам. Ошибка носителей русского: do a photo вместо take a photo."],"r":"Сделать перерыв, сфотографировать. Принять душ, пообедать. Найти работу, поправиться.","e":"make a break, do a photo. Правильно: take a break, take a photo."},"en115":{"x":["У разделяемых фразовых глаголов дополнение стоит либо после частицы (pick up the phone), либо между (pick the phone up). Если дополнение это местоимение (it, them, him), оно обязательно между: pick it up.","Неразделяемые глаголы (look after, get on) не разрываются: look after her, а не look her after."],"r":"Выключи это. Надень обувь. Она взяла трубку.","e":"Turn off it. Местоимение должно стоять между: turn it off."},"en116":{"x":["Идиомы нельзя переводить по словам. A piece of cake значит «проще простого». Break a leg значит «ни пуха ни пера». An arm and a leg значит «стоит очень дорого».","Once in a blue moon: «очень редко». Hit the books: «засесть за учёбу». Идиомы делают речь живой, но не злоупотребляй ими в формальном письме."],"r":"Это проще простого. Ни пуха ни пера! Это стоит целое состояние. Очень редко.","e":"Переводить буквально: a piece of cake не про торт, а про лёгкую задачу."},"en117":{"x":["Мнение: In my opinion, I think, I reckon, As far as I am concerned. Согласие: I agree, Exactly, You are right. Частичное согласие: I see your point, but... Несогласие: I am afraid I disagree.","Глагол agree без to be: I agree, а не I am agree. Agree with человек, agree on вопрос."],"r":"По-моему, это хорошая идея. Я полагаю, нам стоит пойти. Полностью согласен. Понимаю твою мысль, но...","e":"I am agree. Agree это глагол, to be не нужен."},"en118":{"x":["Неформальный стиль: сокращения (I'm, can't), фразовые глаголы (find out), Hi, Thanks, Cheers. Формальный: полные формы (I am, cannot), строгие глаголы (discover), Dear Sir or Madam, Thank you.","Обращение Dear Mr Smith завершают Yours sincerely, а Dear Sir or Madam завершают Yours faithfully. Цель письма вводят: I am writing to..."],"r":"Привет, Том, спасибо за сообщение! Уважаемый господин или госпожа, пишу, чтобы узнать о... С нетерпением жду ответа.","e":"Начинать деловое письмо с Hi и сокращений: «Hi, I can't come»."},"en119":{"x":["Типичные вопросы: Tell me about yourself, What are your strengths and weaknesses, Where do you see yourself in five years. Ответ: коротко, с примерами и фактами.","Полезные слова: experience (опыт), skills (навыки), achievement (достижение), responsible for (отвечал за), deadline (срок). Experience в значении «опыт работы» неисчисляемое: three years of experience."],"r":"Расскажите о себе. Моя главная сильная сторона это командная работа. Почему вы хотите эту работу? У меня три года опыта в продажах.","e":"Говорить an experience, когда имеется в виду опыт работы вообще."},"en120":{"x":["В аэропорту: check in (регистрация), boarding pass (посадочный), gate (выход), baggage claim (получение багажа), delay (задержка). В отеле: book a room, reception, check out, bill.","Вежливые просьбы: Could I have...? I would like to... Is it possible to...? Такие формы звучат мягче, чем I want."],"r":"Я хотел бы зарегистрироваться. Где выход на посадку? У вас есть номер на две ночи? Можно счёт, пожалуйста?","e":"I want a room. Лучше вежливо: I would like a room."},"en121":{"x":["Боль: I have a headache / stomachache / toothache, my back hurts. Симптомы: a cough, a fever, a sore throat, feel dizzy (головокружение), feel sick (тошнит).","Советы врача: You should rest, drink water, take medicine. Врач prescribes (выписывает) лекарство. Прилагательное «больной» это ill (British) или sick."],"r":"У меня болит голова. У меня кружится голова. Тебе надо отдохнуть. Врач выписал антибиотики.","e":"I have a pain head. Правильно: I have a headache или My head hurts."},"en122":{"x":["Лексика: download/upload (скачать/загрузить), app, password, account, battery, screen, update, install. Глаголы: log in/out (войти/выйти), turn on/off, switch, plug in, charge.","Предложения: The website is down (не работает). My phone ran out of battery. Back up your files (сделай резервную копию)."],"r":"Я скачал новое приложение. Батарея телефона садится. Пожалуйста, войдите в аккаунт. Wi-Fi не работает.","e":"My phone is discharged. Для разряженной батареи говорят: my battery is dead или low."},"en123":{"x":["Лексика: climate change, global warming, pollution, recycle, waste, renewable energy, greenhouse gases, endangered species. Глаголы: protect, reduce, save, harm, damage.","Фразы для мнения: We must reduce..., It is crucial to..., Governments should... В эссе их используют для рекомендаций."],"r":"Глобальное потепление это серьёзная проблема. Нам надо больше перерабатывать. Пластик вредит океану. Возобновляемая энергия это будущее.","e":"Писать Ecology problem вместо environmental problem: ecology это наука."},"en124":{"x":["Без артикля: неисчисляемые и множественные в общем смысле (Music is fun, I like dogs), абстрактные понятия (love, time), названия приёмов пищи (have lunch), многие страны и города (Spain, London).","The ставят, когда понятно, о чём речь: Pass me the salt. Также с уникальным (the sun), с рекой, морем (the Thames) и горными цепями (the Alps)."],"r":"Я люблю музыку. Жизнь коротка. Она ходит в школу каждый день. Мы позавтракали в восемь.","e":"I like the music (вообще). The ставят про конкретную музыку, а общую оставляют без артикля."},"en125":{"x":["Plenty of, a lot of, a great deal of (только неисчисляемые) значат «много». A number of (исчисляемые) значит «несколько, ряд».","A few и a little значат «немного, но есть». Few и little без a значат «почти нет». Сравни: I have a few friends (есть) и I have few friends (мало)."],"r":"Времени достаточно. Пришёл ряд людей. У него много опыта. Мало кто это знает.","e":"Много времени как many time. Time неисчисляемое: much time или plenty of time."},"en126":{"x":["Предлоги надо учить вместе с прилагательным: afraid of, good at, interested in, proud of, tired of, angry with (about), keen on, responsible for, famous for.","После предлога глагол стоит в форме -ing: I am good at swimming, I am afraid of flying."],"r":"Я боюсь пауков. Она хороша в математике. Он интересуется музыкой. Мы гордимся тобой.","e":"Interested on music. Правильно: interested in."},"en127":{"x":["Unless значит «если не»: I will not go unless you come. После unless глагол в утвердительной форме, отрицание не ставят дважды.","As long as и provided (that) значат «при условии, что». Как и в if-предложениях, в условной части будущее заменяется настоящим: as long as you pay (а не will pay)."],"r":"Я пойду, если не будет дождя. Можешь взять, если вернёшь. При условии, что ты платишь, можешь остаться.","e":"Unless you don't come. Unless уже значит «если не»: unless you come."},"en128":{"x":["Question tag это короткий вопрос в конце. Утверждение получает отрицательный хвостик, а отрицание положительный: You are tired, aren't you? You aren't tired, are you?","Вспомогательный глагол в хвостике тот же, что и в предложении. Для I am исключение: I am right, aren't I? Для Let's: Let's go, shall we?"],"r":"Ты любишь кофе, да? Её здесь нет, правда? Пойдём, ладно?","e":"You like coffee, do you? После утверждения хвостик отрицательный: don't you."},"en129":{"x":["Was/were going to + глагол: план, который был в прошлом (часто не осуществился). I was going to buy it, but it was too expensive.","Was about to + глагол: «собирался прямо сейчас»: I was about to go to bed when the phone rang. Такие конструкции называют «будущее в прошлом»."],"r":"Я собирался тебе позвонить, но забыл. Они собирались переехать в Испанию. Я собирался уходить, когда ты позвонил.","e":"I am going to call you yesterday. Прошлое требует was going to."},"en130":{"x":["В утвердительном предложении добавляем do/does/did перед глаголом, чтобы подчеркнуть: I do l .sg{flex:none;width:36px;height:36px;border-radius:50%;background:var(--card2);border:2px solid var(--line);color:var(--mu);font-size:15px;font-weight:800;display:grid;place-items:center;box-shadow:none;transition:transform .35s var(--spring),background .3s,border-color .3s}
.sg.dn{background:#4fe3b5;border-color:#4fe3b5;color:#0d1412}
.sg.cur{background:linear-gradient(135deg,var(--g1),var(--g2));border-color:transparent;color:var(--on);transform:scale(1.18);box-shadow:0 0 0 5px color-mix(in srgb,var(--acc) 22%,transparent)}
.sg.cur.dn{background:linear-gradient(135deg,var(--g1),var(--g2))}
.sg:active{transform:scale(.9)}
.sgl{flex:1;height:4px;border-radius:2px;background:var(--line);margin:0 4px;transition:background .4s}
.sgl.dn{background:#4fe3b5}
.tc{--tcc:var(--acc);position:relative;overflow:hidden;padding:15px 15px 15px 18px;border-radius:20px;border:1px solid color-mix(in srgb,var(--tcc) 28%,transparent);animation:rise .45s var(--ease) both}
.tc::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--tcc)}
.tc>em{background:color-mix(in srgb,var(--tcc) 20%,transparent)}
.tcw{--tcc:#ffb15c}.hnt{--tcc:var(--acc)}
.tc:nth-child(2){animation-delay:.06s}.tc:nth-child(3){animation-delay:.12s}.tc:nth-child(4){animation-delay:.18s}.tc:nth-child(5){animation-delay:.24s}
.tc .m{font-weight:800;text-transform:uppercase;letter-spacing:.06em;font-size:11px;color:var(--tcc)}
.code{border-radius:14px;border:1px solid color-mix(in srgb,var(--fg) 8%,transparent);background:#0a100e}
.rvb{border-radius:14px;border-color:color-mix(in srgb,var(--tcc) 50%,transparent);color:var(--tcc);font-weight:800}
.qq{font-size:19px;line-height:1.4}
.qbtn{position:relative;display:flex;align-items:center;gap:12px;padding:13px 14px;margin:10px 0;border-radius:18px;border:2px solid var(--line);background:linear-gradient(160deg,var(--card),var(--p));box-shadow:0 4px 0 color-mix(in srgb,var(--fg) 7%,var(--p));
 animation:rise .4s var(--ease) both;transition:transform .2s var(--spring),border-color .25s,background .25s,box-shadow .2s}
.qbtn:nth-of-type(2){animation-delay:.05s}.qbtn:nth-of-type(3){animation-delay:.1s}.qbtn:nth-of-type(4){animation-delay:.15s}
.qbtn:active{transform:translateY(3px);box-shadow:0 1px 0 color-mix(in srgb,var(--fg) 7%,var(--p))}
.qbtn .ql{width:32px;height:32px;border-radius:50%;background:var(--bg);border:1.5px solid var(--line);font-size:14px;font-weight:800}
.qbtn.ok{background:linear-gradient(135deg,#1f7a55,#2f9d70);border-color:#4fe3b5;box-shadow:0 4px 0 #145438;color:#fff}
.qbtn.bad{background:linear-gradient(135deg,#7a2b2b,#a03a3a);border-color:#ff6b7a;box-shadow:0 4px 0 #561d1d;color:#fff}
.qbtn.ok::after,.qbtn.bad::after{margin-left:auto;font-weight:800;font-size:18px}
.qbtn.ok::after{content:"✓"}.qbtn.bad::after{content:"✕"}
.vok{display:inline-block;padding:6px 14px;border-radius:999px;background:rgba(79,227,181,.15);color:#4fe3b5}
.ed{border-radius:16px;border:2px solid var(--line);background:#0a100e;transition:border-color .25s,box-shadow .25s}
.ed:focus{outline:0;border-color:var(--acc);box-shadow:0 0 0 4px color-mix(in srgb,var(--acc) 18%,transparent)}
.dif{border-radius:999px}
.hintb{border-radius:16px}
.lvb>.pr:last-child{position:sticky;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:2;font-size:16px;box-shadow:0 5px 0 color-mix(in srgb,var(--g2) 55%,#000),0 12px 24px rgba(0,0,0,.35)}
.lvb>.pr:last-child:active{transform:translateY(4px);box-shadow:0 1px 0 color-mix(in srgb,var(--g2) 55%,#000)}
.done{border-radius:24px}
.done em{animation:dnb 1.2s var(--spring) both}
@keyframes dnb{0%{transform:scale(.2) rotate(-20deg)}60%{transform:scale(1.25) rotate(8deg)}100%{transform:none}}
</style>
</body>
